version: 3
workdir: .

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"
  # work/ is a gitignored local scratch directory (see /work in .gitignore) used
  # for replace-based library checkouts. go-arch-lint v1.13+ walks the whole
  # project tree, including gitignored dirs, so exclude it to avoid flagging
  # those files as "not attached to any component".
  - "^.*\/work\/.*$"

vendors:
  color: { in: github.com/fatih/color } 
  pflag: { in: github.com/spf13/pflag }
  go-colorable: { in: github.com/mattn/go-colorable }
  xdg: { in: github.com/adrg/xdg }
  env: { in: github.com/caarlos0/env/v11 }
  sqlite: { in: modernc.org/sqlite }
  tablewriter: { in: [github.com/olekukonko/tablewriter, github.com/olekukonko/tablewriter/tw] }
  diffmatchpatch: { in: github.com/sergi/go-diff/diffmatchpatch }
  difflib: { in: github.com/pmezard/go-difflib/difflib }
  excelize: { in: github.com/xuri/excelize/v2 }
  cmp: { in: github.com/google/go-cmp/cmp }
  gomock: { in: go.uber.org/mock/gomock }
  prompt: { in: github.com/nao1215/prompt }
  term: { in: golang.org/x/term }
  filesql: { in: [github.com/nao1215/filesql, github.com/nao1215/filesql/dialect] }
  runewidth: { in: github.com/mattn/go-runewidth }
  text: { in: [golang.org/x/text/encoding, golang.org/x/text/encoding/japanese, golang.org/x/text/encoding/unicode, golang.org/x/text/transform] }
  fileparser: { in: github.com/nao1215/fileparser }
  compress: { in: github.com/klauspost/compress/zstd }

components:
  cmd:   { in: . }
  shell: { in: shell }
  model: { in: domain/model }
  cleanup: { in: domain/cleanup }
  sqltext: { in: domain/sqltext }
  repository: { in: domain/repository }
  infrastructure: { in: [infrastructure, infrastructure/mock/**] }
  memory-infra: { in: [infrastructure/memory, infrastructure/filesql] }
  persistence-infra: { in: infrastructure/persistence }
  usecase: { in: usecase }
  interactor: { in: interactor/** }
  config: { in: config }
  testutil: { in: testutil }
  di: { in: di }
  mock: { in: [] }

commonVendors:
  - gomock
  - color

commonComponents:
  - model
  - config
  # cleanup is a dependency-free leaf holding the one rule for cleanup errors.
  # Every layer has something to release, so the rule has to be reachable from
  # all of them; that is why it is common rather than a dependency edge.
  - cleanup
  # sqltext is the same shape: a dependency-free leaf holding the one walk over
  # SQL text that tells code from string literals, quoted identifiers, and
  # comments. The shell asks it where a statement ends, the interactor asks it
  # what kind of statement this is, and neither owns the other.
  - sqltext

deps:
  di:
    mayDependOn:
      - model
      - shell
      - usecase
      - interactor
      - repository
      - config
      - infrastructure
      - memory-infra
      - persistence-infra
  config:
    canUse:
      - color
      - filesql
      - pflag
      - go-colorable
      - xdg
      - env
      - sqlite
      - term
  testutil:
    canUse:
      - cmp
      # The corrupt-fixture generator builds a real workbook and a real zstd
      # stream and then damages them, so it needs the writers a fixture that
      # claims to be a damaged one has to have been made with.
      - excelize
      - compress
  model:
    canUse:
      - runewidth
      - tablewriter
  cmd:
    mayDependOn:
      - shell
      - di
  shell:
    canUse:
      - filesql
      - go-colorable
      - prompt
      - tablewriter
      - text
    mayDependOn:
      - model
      - usecase
  usecase:
    canUse:
      - filesql
    mayDependOn:
      - model
      - repository
  interactor:
    canUse:
      - filesql
    mayDependOn:
      - model
      - usecase
      - repository
      - memory-infra
      # The export interactor calls the serializers directly, as the session
      # interactor already calls the loader directly. Each format had an
      # interface of its own with one implementation and one consumer, and
      # nothing ever substituted one, so the indirection bought a file to change
      # per format rather than a seam anyone used.
      - persistence-infra
  # What is left in repository is what an interface earns: the session's SQL
  # access, which the mocks in infrastructure/mock stand in for when a test needs
  # a failure a real database will not produce on demand.
  repository:
    mayDependOn:
      - model
  infrastructure:
    mayDependOn:
      - model
  memory-infra:
    canUse:
      - filesql
      - fileparser
      - excelize
      - sqlite
    mayDependOn:
      - model
      - repository
      - infrastructure
      - usecase
  persistence-infra:
    canUse:
      - excelize
      # A write-back rewrites a file in the encoding it was read with, so the
      # encoders live beside the writers that use them.
      - text
    mayDependOn:
      - model
      - repository
      - infrastructure
      # History satisfies its usecase here, as the session's loader does in
      # memory-infra. The interface it used to implement was declared twice,
      # identical method for identical method, with an interactor forwarding
      # each call unchanged and nothing ever substituting either one.
      - usecase
