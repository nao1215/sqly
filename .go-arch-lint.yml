version: 3
workdir: .

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"
  # work/ is a gitignored local scratch directory (see /work in .gitignore) used
  # for replace-based library checkouts. go-arch-lint v1.13+ walks the whole
  # project tree, including gitignored dirs, so exclude it to avoid flagging
  # those files as "not attached to any component".
  - "^.*\/work\/.*$"

vendors:
  color: { in: github.com/fatih/color } 
  pflag: { in: github.com/spf13/pflag }
  go-colorable: { in: github.com/mattn/go-colorable }
  xdg: { in: github.com/adrg/xdg }
  env: { in: github.com/caarlos0/env/v11 }
  sqlite: { in: modernc.org/sqlite }
  wire: { in: [github.com/google/wire, github.com/google/wire/cmd/wire] }
  tablewriter: { in: [github.com/olekukonko/tablewriter, github.com/olekukonko/tablewriter/tw] }
  diffmatchpatch: { in: github.com/sergi/go-diff/diffmatchpatch }
  difflib: { in: github.com/pmezard/go-difflib/difflib }
  excelize: { in: github.com/xuri/excelize/v2 }
  cmp: { in: github.com/google/go-cmp/cmp }
  gomock: { in: go.uber.org/mock/gomock }
  prompt: { in: github.com/nao1215/prompt }
  term: { in: golang.org/x/term }
  filesql: { in: [github.com/nao1215/filesql, github.com/nao1215/filesql/dialect] }
  runewidth: { in: github.com/mattn/go-runewidth }
  text: { in: [golang.org/x/text/encoding/japanese, golang.org/x/text/encoding/unicode, golang.org/x/text/transform] }
  fileparser: { in: github.com/nao1215/fileparser }

components:
  cmd:   { in: . }
  shell: { in: shell }
  domain: { in: domain }
  model: { in: domain/model }
  cleanup: { in: domain/cleanup }
  repository: { in: domain/repository }
  infrastructure: { in: [infrastructure, infrastructure/mock/**] }
  memory-infra: { in: [infrastructure/memory, infrastructure/filesql] }
  persistence-infra: { in: infrastructure/persistence }
  usecase: { in: usecase }
  interactor: { in: interactor/** }
  config: { in: config }
  testutil: { in: testutil }
  di: { in: di }
  mock: { in: [] }

commonVendors:
  - wire
  - gomock
  - color

commonComponents:
  - model
  - config
  # cleanup is a dependency-free leaf holding the one rule for cleanup errors.
  # Every layer has something to release, so the rule has to be reachable from
  # all of them; that is why it is common rather than a dependency edge.
  - cleanup

deps:
  di:
    mayDependOn:
      - model
      - shell
      - usecase
      - interactor
      - repository
      - config
      - infrastructure
      - memory-infra
      - persistence-infra
  config:
    canUse:
      - color
      - filesql
      - pflag
      - go-colorable
      - xdg
      - env
      - sqlite
      - wire
      - term
  testutil:
    canUse:
      - cmp
  model:
    canUse:
      - runewidth
      - tablewriter
    mayDependOn:
      - domain
  cmd:
    mayDependOn:
      - shell
      - di
  shell:
    canUse:
      - filesql
      - go-colorable
      - prompt
      - tablewriter
      - text
    mayDependOn:
      - model
      - usecase
  usecase:
    canUse:
      - filesql
    mayDependOn:
      - model
      - repository
  interactor:
    canUse:
      - filesql
    mayDependOn:
      - model
      - usecase
      - repository
      - memory-infra
  repository:
    mayDependOn:
      - model
  infrastructure:
    mayDependOn:
      - model
  memory-infra:
    canUse:
      - filesql
      - fileparser
      - excelize
      - sqlite
    mayDependOn:
      - model
      - repository
      - infrastructure
      - usecase
  persistence-infra:
    canUse:
      - excelize
    mayDependOn:
      - model
      - repository
      - infrastructure
