name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "doc/cookbook.md"
      - "doc/img/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "doc/cookbook.md"
      - "doc/img/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.164.0
      HUGO_SHA256: d9c8b17285ea4ec004d9f814273ea910f2051ce02c284993fd1f91ba455ae50d
      PAGEFIND_VERSION: 1.5.2
      PAGEFIND_SHA256: afb824a9e7f64905a934900481cea5be679c03975e527329e0e5e6cc70f5feda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.tar.gz" | sha256sum --check -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/hugo.tar.gz" hugo
          sudo mv "${RUNNER_TEMP}/hugo" /usr/local/bin/hugo
          hugo version

      - name: Build website
        # The commit is stamped into every page so the deploy can be verified
        # afterwards. Hugo reads HUGO_PARAMS_* as config overrides, which is why
        # it arrives as a param rather than through getenv.
        run: make website
        env:
          HUGO_PARAMS_BUILDCOMMIT: ${{ github.sha }}

      - name: Index the site with Pagefind
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/pagefind.tar.gz" \
            "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${PAGEFIND_SHA256}  ${RUNNER_TEMP}/pagefind.tar.gz" | sha256sum --check -
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/pagefind.tar.gz" pagefind
          "${RUNNER_TEMP}/pagefind" --site website/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # A green deploy step means the artifact was accepted, not that the site a
  # reader loads is the one just built. This fetches the live site and checks
  # it: the build commit matches, the current flags are on the page, and the
  # flags removed before v1.0.0 are not.
  #
  # The retry exists because a CDN takes a little while to serve the new copy.
  # It is bounded in both attempts and total wait, and it fails loudly when the
  # bound is reached rather than passing on a timeout.
  verify:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      SITE: https://nao1215.github.io/sqly/
      EXPECTED_SHA: ${{ github.sha }}
      MAX_ATTEMPTS: "10"
      SLEEP_SECONDS: "20"
    steps:
      - name: Wait for the deployed commit to go live
        run: |
          attempt=1
          while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
            # Quote-agnostic on purpose: Hugo's minifier renders the tag as
            # `name=sqly-build-commit content="..."`, dropping the quotes around
            # any attribute value that does not need them. Matching the tag and
            # then pulling the 40-hex commit out of it does not care either way.
            live=$(curl -fsSL --max-time 30 "${SITE}?cachebust=${GITHUB_RUN_ID}-${attempt}" \
              | grep -o 'sqly-build-commit[^>]*' \
              | grep -o '[0-9a-f]\{40\}') || live=""
            if [ "${live}" = "${EXPECTED_SHA}" ]; then
              echo "the live site is ${live}"
              exit 0
            fi
            echo "attempt ${attempt}/${MAX_ATTEMPTS}: live is '${live}', want '${EXPECTED_SHA}'"
            attempt=$((attempt + 1))
            [ "${attempt}" -le "${MAX_ATTEMPTS}" ] && sleep "${SLEEP_SECONDS}"
          done
          echo "::error::the deployed commit ${EXPECTED_SHA} did not appear on ${SITE} within $((MAX_ATTEMPTS * SLEEP_SECONDS))s" >&2
          exit 1

      - name: Check the reference page shows the current flags
        run: |
          page=$(curl -fsSL --max-time 30 "${SITE}reference/?cachebust=${GITHUB_RUN_ID}" | tr -s '[:space:]' ' ')

          # Present: flags v1.0.0 commits to. A page that lost one is a page a
          # reader cannot use to write a working command.
          for flag in --stdin-format --stdin-table --encoding --row-mismatch \
                      --include-hidden-sheets --allow-remote --sql --sql-file \
                      --script-file --dialect --output --output-format \
                      --inspect --inspect-sample; do
            case "${page}" in
              *"${flag}"*) ;;
              *) echo "::error::${flag} is missing from the deployed reference page" >&2; exit 1 ;;
            esac
          done

          # Absent: flags removed before v1.0.0. A page still advertising one
          # sends a reader to write a command that fails.
          for flag in --json-typed --ndjson-typed --import-mode --save-in-place \
                      --save-tables --cache-clear --stdin-name; do
            case "${page}" in
              *"${flag}"*) echo "::error::${flag} was removed but is still on the deployed reference page" >&2; exit 1 ;;
            esac
          done
          echo "the deployed reference page matches the v1.0.0 flag surface"

      - name: Check the deployed pages state the contracts a wrong page would break
        run: |
          # A flag name being present says the page mentions it. These say the
          # page still means what the implementation does — the class of drift a
          # name check cannot see, and the one that misleads a reader worst: a
          # wrapper written against the wrong exit code, or an untrusted URL run
          # on the belief that 2 GiB bounds what it can cost.
          # Every run of whitespace is collapsed to one space before matching.
          # Hugo keeps a Markdown paragraph's source newlines in the HTML, so a
          # claim that wraps in the source — "not a sandbox or an SSRF\ndefense"
          # — is not the string this step looks for, and the check failed while
          # the page was right. The Go drift tests already flatten for exactly
          # this reason (see flatten() in docs_drift_test.go); this makes both
          # readers of the same claim agree.
          fetch() {
            curl -fsSL --max-time 30 "$1" | tr -s '[:space:]' ' '
          }

          reference=$(fetch "${SITE}reference/?cachebust=${GITHUB_RUN_ID}")
          formats=$(fetch "${SITE}formats/?cachebust=${GITHUB_RUN_ID}")

          require() {
            haystack=$1
            needle=$2
            where=$3
            case "${haystack}" in
              *"${needle}"*) ;;
              *) echo "::error::the deployed ${where} page does not state: ${needle}" >&2; exit 1 ;;
            esac
          }

          require "${reference}" "SIGINT stopped the run" "reference"
          require "${reference}" "SIGTERM stopped the run" "reference"
          require "${reference}" "143" "reference"
          require "${reference}" "only the sheets a workbook shows" "reference"
          require "${formats}" "only the sheets a workbook shows" "formats"
          require "${formats}" "very hidden" "formats"
          require "${formats}" "2 GiB" "formats"
          require "${formats}" "What the download limit does not bound" "formats"

          # The rc3 agent-safety contracts. A page that lost one of these reads
          # correctly and describes a tool that no longer behaves that way,
          # which is the drift that misleads a reader worst: a script written
          # against a URL sqly will refuse, or an --inspect believed to be
          # schema-only when it is not.
          require "${reference}" "schema-only by default" "reference"
          require "${reference}" "schema_version" "reference"
          require "${reference}" "sqly_version" "reference"
          require "${reference}" "schema/inspect-v1.schema.json" "reference"
          require "${formats}" "default-deny" "formats"
          require "${formats}" "not a sandbox or an SSRF defense" "formats"
          require "${formats}" "--allow-remote" "formats"

          dialects=$(fetch "${SITE}dialects/?cachebust=${GITHUB_RUN_ID}")
          require "${dialects}" "translation, not emulation" "dialects"
          require "${dialects}" "SQLite semantics" "dialects"

          about=$(fetch "${SITE}about/?cachebust=${GITHUB_RUN_ID}")
          require "${about}" "Historical measurement" "about"
          require "${about}" "not a performance guarantee" "about"
          echo "the deployed pages state the v1.0.0 contracts"

      # The formal --inspect schema is a file, not a page, and it is the one
      # thing on the site a program fetches rather than a person. A deploy that
      # published the pages and dropped the schema would leave every consumer
      # validating against a 404.
      - name: Check the deployed site serves the inspect JSON Schema
        run: |
          url="${SITE}schema/inspect-v1.schema.json?cachebust=${GITHUB_RUN_ID}"
          curl -fsSL --max-time 30 "${url}" -o deployed-schema.json || {
            echo "::error::${url} is not being served" >&2; exit 1;
          }
          # Parsed rather than grepped. A substring check passes on a truncated
          # response, on HTML served by a 404 handler that happens to mention
          # the words, and on a document whose keys sit at the wrong depth —
          # all of which would leave a consumer validating against nothing.
          python3 - deployed-schema.json <<'PY'
          import json, sys

          schema = json.load(open(sys.argv[1]))
          assert "2020-12" in schema["$schema"], schema["$schema"]
          assert schema["properties"]["schema_version"]["const"] == 1, schema["properties"]["schema_version"]
          for field in ("schema_version", "sqly_version", "tables"):
              assert field in schema["required"], schema["required"]
          table = schema["$defs"]["table"]
          assert "sample_rows" in table["required"], table["required"]
          assert table["properties"]["sample_rows"]["type"] == "array", table["properties"]["sample_rows"]
          print("the deployed inspect schema parses and states the v1 contract")
          PY
