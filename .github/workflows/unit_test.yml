name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel the superseded run of a pull request when it is pushed again; runs
# on main are grouped by commit so none of them is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit_test:
    name: Unit test (linux)

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        go:
          # Pinned to the patch, not the minor. setup-go resolves a bare "1.26"
          # from its own manifest and pins GOTOOLCHAIN to what it installs, so a
          # runner that had an older 1.26 patch would refuse a go.mod asking for
          # 1.26.11 and the job would fail on a version this repository never chose.
          #
          # The "1" leg is the newest Go. setup-go resolves a bare "1" from its
          # own manifest, which lags a fresh Go release (it was still handing
          # out 1.26 after 1.27.0 shipped), so the step below installs "stable"
          # for it. The leg keeps the name "1" because main's branch protection
          # requires the three "Unit test (linux) (<os>, 1)" contexts by name.
          # A separate "stable" leg used to run beside it and installed the
          # same Go, so it tested nothing the "1" leg did not.
          - "1"
          - "1.26.11"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The "1" leg installs "stable": its manifest answer (go1.26.8 on
      # 2026-10-09) is below the go.mod directive and cannot build the module.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == '1' && 'stable' || matrix.go }}

      - name: Run tests with coverage report output
        run: go test -v -cover -coverprofile coverage.out ./...
