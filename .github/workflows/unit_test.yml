name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Unit test (linux)

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        go:
          # Pinned to the patch, not the minor. setup-go resolves a bare "1.25"
          # from its own manifest and pins GOTOOLCHAIN to what it installs, so a
          # runner that had 1.25.12 refused a go.mod asking for 1.25.13 and the
          # job failed on a version this repository never chose.
          #
          # "1" and "stable" are both here, and they are not redundant: setup-go
          # resolves "1" from the same manifest, which lags a fresh Go release,
          # so "1" was still handing out 1.26 after 1.27.0 shipped. "stable" is
          # the leg that actually tests the newest Go. "1" stays because main's
          # branch protection requires the three "Unit test (linux) (<os>, 1)"
          # contexts by name; dropping it would leave those permanently absent
          # and every pull request blocked. It can go once the protection rule
          # names the "stable" contexts instead.
          - "1"
          - "stable"
          - "1.25.13"
          - "1.26.6"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage report output
        run: go test -v -cover -coverprofile coverage.out ./...
