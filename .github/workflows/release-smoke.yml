name: Release Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build the release artifacts in snapshot mode (no publishing, signing, or SBOM)
# and validate them on every PR and push, so archive-layout and packaging
# regressions are caught before a real release tag is cut instead of at tag time.
permissions:
  contents: read

# Cancel the superseded run of a pull request when it is pushed again; runs
# on main are grouped by commit so none of them is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-smoke:
    name: release artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-go's cache is keyed only on go.sum and the Go version, so this
      # job restored whichever job saved that key first, usually a unit test
      # that built for one platform, and goreleaser then compiled every
      # release target from scratch. The job keeps its own build cache for the
      # cross builds, saved from main and restored on pull requests. The real
      # release workflow builds without a cache. The key is the Go version and
      # go.sum, not the commit: a per-commit key saved a new 900 MB entry on
      # every push to main and filled the repository's 10 GB cache quota. main
      # saves only when the exact key is missing, so the entry is refreshed
      # when go.sum or the Go version changes.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      - name: Restore the cross build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-release-smoke-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-release-smoke-go${{ steps.setup-go.outputs.go-version }}-

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Match the version used by the real release workflow for parity.
          version: "v2.16.0"
          args: release --snapshot --clean --skip=sign,sbom,publish

      - name: Validate artifacts
        run: sh scripts/smoke_artifacts.sh

      - name: Save the cross build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
