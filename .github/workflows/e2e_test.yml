name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The suite only reads the repository and runs the binary it builds.
permissions:
  contents: read

jobs:
  atago:
    name: atago (binary e2e)

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Install atago
        uses: nao1215/setup-atago@e4b6719aea547a68e6c15252222babab7f492a88 # v0.1.1
        with:
          version: v0.18.0

      - name: Run atago end-to-end tests
        # The hermetic runner builds sqly and runs the suite in a temp-backed
        # HOME/config sandbox, so local and CI execution are identical. The suite
        # includes the interactive-shell pty specs, which run over a real pty here.
        run: make test-e2e

  # The interactive shell (its readline REPL) is the one path the POSIX pty
  # harness (e2e/pty_e2e_test.go) cannot cover on Windows, because it needs a
  # sqly ships for Windows, so the behavior suite runs there too, not only on
  # Linux and macOS. Six scenarios need a POSIX shell (an http.server fixture,
  # gzip(1), a pipeline) and carry `skip: {os: windows}`; everything else — write
  # back, caching, path handling, every format, the dialects — is asserted on
  # Windows against a real sqly.exe. Windows-only defects are otherwise invisible
  # until a user hits them: `os.Rename` refuses to replace a file another handle
  # has open, which is every in-place save, and no Unix run can show that.
  #
  # The pty specs run as a second, serialized pass. atago >= v0.7.0 drives a
  # ConPTY on Windows, and the concurrent sessions starve each other otherwise.
  # That pass does not retry: a keystroke this platform loses is a bug to fix.
  # It used to, because ConPTY dropped input delivered while the prompt was being
  # redrawn — the prompt library spent up to 100ms of every redraw reading the
  # input handle for a terminal size reply, and swallowed what was typed into it.
  # prompt v0.0.14 stopped doing that.
  atago-windows:
    name: atago (binary e2e) (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Install atago
        uses: nao1215/setup-atago@e4b6719aea547a68e6c15252222babab7f492a88 # v0.1.1
        with:
          version: v0.18.0

      - name: Build sqly
        run: go build -o sqly.exe main.go

      - name: Run the behavior specs
        shell: bash
        run: |
          export PATH="$PWD:$PATH"
          export HOME="$RUNNER_TEMP/sqlyhome"
          export USERPROFILE="$HOME"
          export SQLY_HISTORY_DB_PATH="$RUNNER_TEMP/history.db"
          mkdir -p "$HOME"
          # Every spec except the pty one, which needs its own serialized pass.
          specs=()
          for spec in ./e2e/atago/*.atago.yaml; do
            [ "$spec" = "./e2e/atago/pty.atago.yaml" ] && continue
            specs+=("$spec")
          done
          atago run --ci --retry-failed 3 "${specs[@]}"

      - name: Run the interactive-shell pty specs
        shell: bash
        run: |
          export PATH="$PWD:$PATH"
          export HOME="$RUNNER_TEMP/sqlyhome"
          export USERPROFILE="$HOME"
          export SQLY_HISTORY_DB_PATH="$RUNNER_TEMP/history.db"
          mkdir -p "$HOME"
          atago run --ci --parallel 1 --retry-failed 0 ./e2e/atago/pty.atago.yaml
