# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# sqly measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a user starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Inputs are generated by gen.sh before measuring. Both revisions run the
# working tree's gen.sh (${head_root}), so they read the same bytes.
version: "1"

suite:
  name: sqly
  description: Start-up, importing CSV of 10 to 1 000 000 rows, query output in each format, and the interactive shell typed key by key.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..

defaults:
  warmup: 2
  runs: 20
  # sqly remembers the theme and the history under HOME; keep both in the
  # benchmark's own directory.
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu:
      max_percent: 15
      min_difference: 2ms
    memory:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting sqly and exiting.
    tags: [smoke]
    commands:
      sqly:
        command: ["${artifact}", --version]

  - name: query 10
    description: Every row of a CSV of 10 rows, in three output formats. Start-up and the import dominate.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "10", "${workdir}/bench.csv"]
    baseline: csv
    commands:
      csv:
        command: ["${artifact}", --output-format, csv, --sql, "SELECT * FROM bench", "${workdir}/bench.csv"]
      json:
        command: ["${artifact}", --output-format, json, --sql, "SELECT * FROM bench", "${workdir}/bench.csv"]
      table:
        command: ["${artifact}", --output-format, table, --sql, "SELECT * FROM bench", "${workdir}/bench.csv"]

  - name: query 100k
    description: >-
      Every row of a CSV of 100 000 rows (an integer, a real, a zero-padded
      code that must stay text, and text), written as CSV, JSON and JSON Lines:
      the import, turning the result into rows, and each output format.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "100000", "${workdir}/bench.csv"]
    baseline: csv
    metrics:
      throughput:
        work:
          file_size: "${workdir}/bench.csv"
    commands:
      csv:
        command: ["${artifact}", --output-format, csv, --sql, "SELECT * FROM bench", "${workdir}/bench.csv"]
      json:
        command: ["${artifact}", --output-format, json, --sql, "SELECT * FROM bench", "${workdir}/bench.csv"]
      jsonl:
        command: ["${artifact}", --output-format, jsonl, --sql, "SELECT * FROM bench", "${workdir}/bench.csv"]

  - name: query 10k
    description: Every row of a CSV of 10 000 rows as a table, which measures every column's width first, against CSV.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "10000", "${workdir}/bench.csv"]
    baseline: csv
    commands:
      csv:
        command: ["${artifact}", --output-format, csv, --sql, "SELECT * FROM bench", "${workdir}/bench.csv"]
      table:
        command: ["${artifact}", --output-format, table, --sql, "SELECT * FROM bench", "${workdir}/bench.csv"]

  - name: import 100k
    description: Importing a CSV of 100 000 rows and counting them, so the import dominates and the output is one line.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "100000", "${workdir}/bench.csv"]
    metrics:
      throughput:
        work:
          file_size: "${workdir}/bench.csv"
    commands:
      sqly:
        command: ["${artifact}", --sql, "SELECT COUNT(*) FROM bench", "${workdir}/bench.csv"]

  - name: import 1m
    description: Importing a CSV of 1 000 000 rows and counting them.
    tags: [large]
    # One run takes seconds, so this benchmark takes the fewest runs a
    # comparison can judge (regression.min_samples, 10) instead of 20.
    runs: 10
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "1000000", "${workdir}/bench.csv"]
    metrics:
      throughput:
        work:
          file_size: "${workdir}/bench.csv"
    commands:
      sqly:
        command: ["${artifact}", --sql, "SELECT COUNT(*) FROM bench", "${workdir}/bench.csv"]

  - name: import 8 files
    description: A directory of eight CSV files of 25 000 rows each, every file a table of its own.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "25000", "${workdir}/parts/part0.csv"]
      - command: [sh, -c, 'for i in 1 2 3 4 5 6 7; do cp "$1/part0.csv" "$1/part$i.csv"; done', sh, "${workdir}/parts"]
    commands:
      sqly:
        command: ["${artifact}", --sql, "SELECT COUNT(*) FROM part7", "${workdir}/parts"]

  - name: customers 100k
    description: >-
      The historical benchmark of sqly: 1000 rows selected by a range of
      Index and sorted, from the 100 000 customers of testdata (12 columns).
    tags: [large]
    commands:
      sqly:
        command: ["${artifact}", --sql, "SELECT * FROM `customers100000` WHERE `Index` BETWEEN 1000 AND 2000 ORDER BY `Index` DESC LIMIT 1000", "${head_root}/../testdata/benchmark/customers100000.csv"]

  - name: query error
    description: A query on a table the session does not have, which fails with a hint and exit 1.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "10", "${workdir}/bench.csv"]
    exit_codes: [1]
    commands:
      sqly:
        command: ["${artifact}", --sql, "SELECT * FROM missing", "${workdir}/bench.csv"]

  - name: shell start
    description: Opening the interactive shell on a file and typing .exit.
    tags: [smoke, shell]
    terminal: true
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "10", "${workdir}/bench.csv"]
    stdin:
      content: ".exit\n"
    commands:
      sqly:
        command: ["${artifact}", "${workdir}/bench.csv"]

  - name: shell completion 50 tables
    description: >-
      Typing a query in the shell over 50 tables of four columns and pressing
      Tab after a table name prefix; every key asks the completer for
      candidates among the tables and their columns.
    tags: [shell]
    terminal: true
    setup:
      - command: [sh, "${head_root}/gen.sh", tables, "50", "${workdir}/tables"]
    stdin:
      content: "SELECT col_a FROM table4\t\u0015.exit\n"
    commands:
      sqly:
        command: ["${artifact}", "${workdir}/tables"]

  - name: shell file completion
    description: >-
      Typing .import and a path in a tree of 50 directories of 50 files, and
      pressing Tab inside one leaf directory; only that directory is listed.
    tags: [shell]
    terminal: true
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "10", "${workdir}/bench.csv"]
      - command: [sh, "${head_root}/gen.sh", tree, "50", "${workdir}/data"]
    cwd: "${workdir}"
    stdin:
      content: ".import data/dir49/file4\t\u0015.exit\n"
    commands:
      sqly:
        command: ["${artifact}", "${workdir}/bench.csv"]

  - name: shell highlight 50 columns
    description: >-
      Typing a SELECT of 50 columns with multi-byte names key by key; sqly
      highlights and redraws the whole statement on every key.
    tags: [shell]
    terminal: true
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "10", "${workdir}/bench.csv"]
      - command: [sh, "${head_root}/gen.sh", statement, "50", "${workdir}/keys"]
      - command: [sh, -c, 'printf "\025.exit\n" >> "$1"', sh, "${workdir}/keys"]
    stdin: "${workdir}/keys"
    commands:
      sqly:
        command: ["${artifact}", "${workdir}/bench.csv"]
