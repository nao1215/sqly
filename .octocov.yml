# generated by octocov init
coverage:
  if: true
  # Unit and E2E coverage together is 94.5%. A pull request may not lower it,
  # and the total may not fall below 94%.
  acceptable: current >= 94% && diff >= 0%
  exclude:
    - "**/testutil/*.go"
    - "**/mock/*.go"
    - "**/golden/*.go"
    - "**/shell/wire.go"
    - "**/interactor/wire.go"
    - "**/config/wire.go"
    - "**/di/*.go"
    - "**/main.go"
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
  hideFooterLink: false
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
