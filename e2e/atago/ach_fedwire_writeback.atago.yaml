# Migrated from sqly's ShellSpec spec/ach_fedwire_writeback_spec.sh (issue #242).
# sqly reconstructs a complete .ach/.fed file from its imported table set after
# an in-session UPDATE, via the whole-set .save path. The
# single-table --output/.dump path still rejects .ach/.fed. ACH/Fed testdata is
# copied in via fixture.from. Run with: make test-e2e
version: "1"

suite:
  name: sqly ACH/Fedwire native write-back

scenarios:
  - name: round-trips an ACH file through .save --in-place after an UPDATE
    steps:
      - fixture: &ach
          file: payment.ach
          from: testdata/ppd-debit.ach
      - run:
          command: sqly payment.ach
          stdin: |
            UPDATE payment_entries SET individual_name='E2E Receiver' WHERE entry_index=0;
            .save --in-place
      - assert:
          stderr:
            contains: Saved
      - run:
          command: sqly --output-format json --sql "SELECT individual_name FROM payment_entries WHERE entry_index=0" payment.ach
      - assert:
          exit_code: 0
          stdout:
            contains: "E2E Receiver"

  - name: writes a reconstructed ACH file into a directory with .save DIR
    steps:
      - fixture: *ach
      - run:
          command: sqly payment.ach
          stdin: |
            UPDATE payment_entries SET individual_name='Dir Receiver' WHERE entry_index=0;
            .save out
      - assert:
          stderr:
            contains: Saved
      - run:
          command: sqly --output-format json --sql "SELECT individual_name FROM payment_entries WHERE entry_index=0" out/payment.ach
      - assert:
          exit_code: 0
          stdout:
            contains: "Dir Receiver"

  - name: round-trips a Fedwire file through .save --in-place after an UPDATE
    steps:
      - fixture:
          file: transfer.fed
          from: testdata/customer-transfer.fed
      - run:
          command: sqly transfer.fed
          stdin: |
            UPDATE transfer_message SET sender_reference='E2EREF';
            .save --in-place
      - assert:
          stderr:
            contains: Saved
      - run:
          command: sqly --output-format json --sql "SELECT sender_reference FROM transfer_message" transfer.fed
      - assert:
          exit_code: 0
          stdout:
            contains: E2EREF

  - name: still rejects a single-table --output to .ach
    steps:
      - fixture: *ach
      - run:
          command: sqly --sql "SELECT * FROM payment_entries" --output out.ach payment.ach
      - assert:
          exit_code: 4
          stderr:
            contains: "input-only"

  - name: keeps filesql's own bookkeeping table out of .tables
    steps:
      - fixture: *ach
      - run:
          command: sqly payment.ach
          stdin: ".tables\n"
      - assert:
          exit_code: 0
          stdout:
            contains: payment_entries
            not_contains: _filesql_

  - name: does not write filesql's own bookkeeping table into a .save directory
    steps:
      - fixture: *ach
      - run:
          command: sqly payment.ach
          stdin: |
            UPDATE payment_entries SET individual_name='Reserved Check' WHERE entry_index=0;
            .save out
      - assert:
          exit_code: 0
          file:
            path: out/payment.ach
            exists: true
      - assert:
          file:
            path: out/_filesql_sources.csv
            exists: false

  - name: refuses an input whose table name is reserved by filesql
    steps:
      - fixture:
          file: _filesql_report.csv
          content: |
            id,amount
            1,100
      - run:
          command: sqly --sql "SELECT amount FROM _filesql_report" _filesql_report.csv
      - assert:
          exit_code: 3
          stderr:
            contains: _filesql_
