# The exit code contract. A wrapper that runs sqly from a shell script or CI has
# one question when it fails: whose fault was it. Each class below is a different
# answer and a different next step, so they are checked against the real binary —
# a unit test on the classifier cannot see the code the process actually returns.
#
# The hermetic runner (scripts/run_e2e.sh) builds sqly and puts it on PATH.
# Run with: make test-e2e
version: "1"

suite:
  name: sqly exit code contract

scenarios:
  - name: a run that succeeds exits 0
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly --sql "SELECT actor FROM actor" actor.csv
      - assert:
          exit_code: 0

  # 2: the command line or the script is not acceptable. Nothing was read and
  # nothing was written, so the fix is always on the command line.
  - name: an unknown flag exits 2
    steps:
      - run:
          command: sqly --no-such-flag
      - assert:
          exit_code: 2
          stderr:
            contains: "unknown flag"

  - name: no arguments and no stdin script exits 2
    steps:
      - run:
          command: sqly
          stdin: ""
      - assert:
          exit_code: 2

  - name: two flags that contradict exit 2
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly --inspect --sql "SELECT 1" actor.csv
      - assert:
          exit_code: 2
          stderr:
            contains: "--inspect cannot be combined with --sql"

  - name: a binary output format with nowhere to write it exits 2
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly --output-format parquet --sql "SELECT 1" actor.csv
      - assert:
          exit_code: 2
          stderr:
            contains: "add --output FILE"

  - name: a helper command in a SQL file exits 2
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - fixture:
          file: q.sql
          content: |
            SELECT 1;
            .save --in-place
      - run:
          command: sqly --sql-file q.sql actor.csv
      - assert:
          exit_code: 2
          stderr:
            contains: "helper command"

  - name: two results in a format that cannot separate them exits 2
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - fixture:
          file: q.sql
          content: |
            SELECT 1;
            SELECT 2;
      - run:
          command: sqly --output-format csv --sql-file q.sql actor.csv
      - assert:
          exit_code: 2

  # 3: an input could not be read. The command line was fine; a different file,
  # or a fixed one, is the next step.
  - name: an input path that does not exist exits 3
    steps:
      - run:
          command: sqly no_such_file.csv
      - assert:
          exit_code: 3
          stderr:
            contains: "path does not exist"

  - name: one missing input among several exits 3
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly --sql "SELECT 1" actor.csv no_such_file.csv
      - assert:
          exit_code: 3

  - name: a --sql-file that does not exist exits 3
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly --sql-file no_such_query.sql actor.csv
      - assert:
          exit_code: 3
          stderr:
            contains: "--sql-file"

  # 4: a destination could not be written. Results may already have been
  # produced, so a retry has to consider what is on disk.
  - name: an output destination whose parent is missing exits 4
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly --sql "SELECT 1" --output no_such_dir/out.csv actor.csv
      - assert:
          exit_code: 4
          stderr:
            contains: "does not exist"

  - name: saving a table with no file behind it exits 4
    steps:
      - run:
          command: sqly --stdin-format csv --stdin-table piped
          stdin: |
            a,b
            1,2
      - assert:
          exit_code: 2

  - name: a save to a source format sqly cannot write exits 4
    steps:
      - fixture:
          file: rows.json
          content: |
            {"a": 1}
      - run:
          command: sqly rows.json
          stdin: "UPDATE rows SET data = '{\"a\": 2}';\n.save --in-place\n"
      - assert:
          exit_code: 4

  # 1: the invocation and the data were both fine and a statement failed. This
  # is the only class where the SQL itself is what needs changing.
  - name: a query against a table that does not exist exits 1
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly --sql "SELECT * FROM no_such_table" actor.csv
      - assert:
          exit_code: 1
          stderr:
            contains: "no such table"

  - name: a syntax error in a piped script exits 1
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly actor.csv
          stdin: "SELECT FROM WHERE;\n"
      - assert:
          exit_code: 1

  # The classes must stay distinct: results go to stdout and every diagnostic to
  # stderr, so a pipeline that reads stdout never sees an error message.
  - name: a failing run writes nothing to stdout
    steps:
      - fixture:
          file: actor.csv
          content: |
            actor,age
            Ken,40
      - run:
          command: sqly --sql "SELECT * FROM no_such_table" actor.csv
      - assert:
          exit_code: 1
          stdout:
            empty: true

  # 130: the run was stopped by a signal. This is the class a unit test cannot
  # reach — it is the process's own exit status, produced by the signal handler,
  # the cancellation reaching a blocking read, and the cleanup that follows.
  #
  # Two things make these scenarios prove something. First, the FIFO writer is
  # what synchronizes: `exec > pipe` blocks until a reader opens the other end,
  # so the ready marker cannot appear before sqly has the FIFO open. A sleep
  # would only be a guess about how long that takes.
  #
  # The FIFO writer runs with its stdio on /dev/null and `exec`s the sleep, so it
  # is one process that `kill` reaches directly and that never holds the test
  # runner's capture pipes open. Backgrounding a subshell that keeps them was
  # enough to error these scenarios on macOS while passing on Linux.
  #
  # The marker says the FIFO has a reader, and the reader is the shell setting up
  # the redirection — which happens before it execs sqly. So the marker is a
  # lower bound, not the moment sqly is ready, and a signal sent on it can arrive
  # before the handler is installed and be lost. A settle follows it for that
  # reason. It is not the thing being measured: the elapsed-time assertion below
  # starts at the signal, so a slow settle cannot make a broken run look prompt.
  #
  # Second, the exit status alone proves nothing here, for two reasons. A process
  # killed by the default SIGINT handler is also reported as 130 by the shell —
  # so stderr is asserted, and a process killed outright never gets to write it.
  # And a run that ignores the cancellation still exits 130 eventually, once the
  # FIFO writer goes away and the read finally returns: that is the original bug,
  # and it is invisible to any assertion that does not care how long it took. So
  # the elapsed time between the signal and the exit is what is checked, not just
  # the code.
  - name: an interrupted run exits 130 after reporting the cancellation itself
    # Needs a POSIX shell for job control, FIFOs, and kill.
    skip:
      os: windows
    steps:
      - fixture:
          file: rows.csv
          content: |
            id
            1
      - run:
          command: sh -c 'mkfifo pipe; (exec 3> pipe; touch writer-ready; exec sleep 30) >/dev/null 2>&1 & holder=$!; sqly rows.csv < pipe > /dev/null 2> err.log & child=$!; i=0; until [ -f writer-ready ]; do i=$((i+1)); [ $i -ge 100 ] && { echo "sqly never opened the FIFO" >&2; exit 1; }; sleep 0.1; done; sleep 2; start=$(date +%s); kill -INT $child; wait $child; code=$?; elapsed=$(( $(date +%s) - start )); kill $holder 2>/dev/null; wait $holder 2>/dev/null; echo "exit=$code"; [ "$elapsed" -le 5 ] && echo prompt || echo "slow after ${elapsed}s"'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "exit=130"
              - "prompt"
      - assert:
          # A process killed outright never gets to say this.
          file:
            path: err.log
            contains: "context canceled"

  # SIGTERM is the other half of the contract, and the one a wrapper cares about:
  # 130 says a person pressed Ctrl-C, 143 says the surrounding system took the run
  # away. sqly used to report both as 130, which made them indistinguishable to
  # everything downstream. The two scenarios below are identical apart from the
  # signal, so a regression that collapses them back onto one code fails here.
  - name: a terminated run exits 143, not the interrupt code
    skip:
      os: windows
    steps:
      - fixture:
          file: rows.csv
          content: |
            id
            1
      - run:
          command: sh -c 'mkfifo pipe; (exec 3> pipe; touch writer-ready; exec sleep 30) >/dev/null 2>&1 & holder=$!; sqly rows.csv < pipe > /dev/null 2> err.log & child=$!; i=0; until [ -f writer-ready ]; do i=$((i+1)); [ $i -ge 100 ] && { echo "sqly never opened the FIFO" >&2; exit 1; }; sleep 0.1; done; sleep 2; start=$(date +%s); kill -TERM $child; wait $child; code=$?; elapsed=$(( $(date +%s) - start )); kill $holder 2>/dev/null; wait $holder 2>/dev/null; echo "exit=$code"; [ "$elapsed" -le 5 ] && echo prompt || echo "slow after ${elapsed}s"'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "exit=143"
              - "prompt"
          # 130 would mean the signal was classified as an interrupt, which is
          # the regression this scenario exists for.
      - assert:
          stdout:
            not_contains: "exit=130"
      - assert:
          # A process killed outright by the default handler never gets here.
          file:
            path: err.log
            contains: "context canceled"

  - name: a terminated run leaves no staged temp directory behind
    skip:
      os: windows
    steps:
      - fixture:
          file: rows.csv
          content: |
            id
            1
      - run:
          # The cleanup is what trapping the signal buys. A SIGTERM that killed
          # the process outright would leave the staging directory on disk, so
          # this is the same check the SIGINT scenario makes, for the code path
          # that now exits differently.
          command: sh -c 'mkdir -p tmp; export TMPDIR="$PWD/tmp"; mkfifo pipe; (exec 3> pipe; touch writer-ready; exec sleep 30) >/dev/null 2>&1 & holder=$!; sqly --stdin-format csv --sql "SELECT 1" < pipe > /dev/null 2>/dev/null & child=$!; i=0; until [ -f writer-ready ]; do i=$((i+1)); [ $i -ge 100 ] && { echo "sqly never opened the FIFO" >&2; exit 1; }; sleep 0.1; done; sleep 2; kill -TERM $child; wait $child; kill $holder 2>/dev/null; wait $holder 2>/dev/null; ls tmp | grep -c sqly- || echo 0'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains: "0"

  - name: a second signal ends the run immediately
    skip:
      os: windows
    steps:
      - fixture:
          file: rows.csv
          content: |
            id
            1
      - run:
          # Trapping a signal takes away the guarantee that it always kills the
          # process, so the first one cancels and the second restores that. The
          # FIFO writer is left in place here on purpose: nothing else will end
          # the read, so a run that ignored the second signal would hang until
          # the timeout rather than exit.
          command: sh -c 'mkfifo pipe; (exec 3> pipe; touch writer-ready; exec sleep 30) >/dev/null 2>&1 & holder=$!; sqly rows.csv < pipe > /dev/null 2>/dev/null & child=$!; i=0; until [ -f writer-ready ]; do i=$((i+1)); [ $i -ge 100 ] && { echo "sqly never opened the FIFO" >&2; exit 1; }; sleep 0.1; done; sleep 2; kill -INT $child; sleep 0.2; kill -INT $child 2>/dev/null; start=$(date +%s); wait $child; code=$?; elapsed=$(( $(date +%s) - start )); kill $holder 2>/dev/null; wait $holder 2>/dev/null; echo "exit=$code"; [ "$elapsed" -le 5 ] && echo prompt || echo "slow after ${elapsed}s"'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains: "prompt"

  - name: two signals sent back to back still end the run
    skip:
      os: windows
    steps:
      - fixture:
          file: rows.csv
          content: |
            id
            1
      - run:
          # The scenario above spaces the two signals apart, which is what a
          # person does. This one sends them with nothing in between, so the
          # second can land while the first is still being handled and the
          # default disposition has not been restored yet. A one-slot channel
          # drops it there, and "press it again" would need a third press.
          command: sh -c 'mkfifo pipe; (exec 3> pipe; touch writer-ready; exec sleep 30) >/dev/null 2>&1 & holder=$!; sqly rows.csv < pipe > /dev/null 2>/dev/null & child=$!; i=0; until [ -f writer-ready ]; do i=$((i+1)); [ $i -ge 100 ] && { echo "sqly never opened the FIFO" >&2; exit 1; }; sleep 0.1; done; sleep 2; start=$(date +%s); kill -INT $child; kill -INT $child 2>/dev/null; wait $child; code=$?; elapsed=$(( $(date +%s) - start )); kill $holder 2>/dev/null; wait $holder 2>/dev/null; echo "exit=$code"; [ "$elapsed" -le 5 ] && echo prompt || echo "slow after ${elapsed}s"'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "exit=130"
              - "prompt"

  - name: a signal during a download ends the run and removes what it staged
    skip:
      os: windows
    steps:
      - run:
          # A server that accepts the connection and then never answers is the
          # case a timeout would eventually cover — sqly's header deadline is 30
          # seconds — and a signal has to cover now. The temp directory the
          # download staged has to be gone afterwards. python3 serves it because
          # the rest of this suite's HTTP fixtures already do.
          command: sh -c 'mkdir -p tmp; export TMPDIR="$PWD/tmp"; python3 -c "import socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind((\"127.0.0.1\", 45917)); s.listen(5); time.sleep(60)" >/dev/null 2>&1 & server=$!; i=0; until python3 -c "import socket,sys; sys.exit(socket.socket().connect_ex((\"127.0.0.1\",45917)))"; do i=$((i+1)); [ $i -ge 50 ] && { echo "the stalling fixture never started listening" >&2; exit 1; }; sleep 0.1; done; sqly --sql "SELECT 1" http://127.0.0.1:45917/data.csv > /dev/null 2>/dev/null & child=$!; sleep 2; start=$(date +%s); kill -TERM $child; wait $child; code=$?; elapsed=$(( $(date +%s) - start )); kill $server 2>/dev/null; wait $server 2>/dev/null; echo "exit=$code"; [ "$elapsed" -le 5 ] && echo prompt || echo "slow after ${elapsed}s"; ls tmp 2>/dev/null | grep -c sqly-http || echo 0'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "exit=143"
              - "prompt"
              - "0"

  - name: a run that timed out is an input failure, not a signal
    steps:
      - run:
          # sqly's only deadlines are on the HTTP client. Reporting a timeout as
          # 130 or 143 would send a wrapper looking for a signal nobody sent.
          command: sqly --sql "SELECT 1" http://127.0.0.1:1/data.csv
      - assert:
          exit_code: 3
      - assert:
          stdout:
            empty: true

  - name: an interrupted run leaves no staged temp directory behind
    skip:
      os: windows
    steps:
      - fixture:
          file: rows.csv
          content: |
            id
            1
      - run:
          # TMPDIR is redirected into the workdir so the check sees only what this
          # run created. The staging directory is made before the read blocks, so
          # by the time the signal arrives there is something to clean up: a
          # process killed outright would leave it behind.
          command: sh -c 'mkdir -p tmp; export TMPDIR="$PWD/tmp"; mkfifo pipe; (exec 3> pipe; touch writer-ready; exec sleep 30) >/dev/null 2>&1 & holder=$!; sqly --stdin-format csv --sql "SELECT 1" < pipe > /dev/null 2>/dev/null & child=$!; i=0; until [ -f writer-ready ]; do i=$((i+1)); [ $i -ge 100 ] && { echo "sqly never opened the FIFO" >&2; exit 1; }; sleep 0.1; done; sleep 2; kill -INT $child; wait $child; kill $holder 2>/dev/null; wait $holder 2>/dev/null; ls tmp | grep -c sqly- || echo 0'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains: "0"
