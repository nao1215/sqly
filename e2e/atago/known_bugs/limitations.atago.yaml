# Dialect behavior sqly cannot reproduce, kept as an executable record of the
# gap rather than a bug to fix. Each scenario asserts the behavior the source
# dialect has, so it fails today and would start passing if the obstacle ever
# went away.
#
# Run with: sh scripts/run_known_bugs.sh
version: "1"

suite:
  name: sqly dialect limitations

scenarios:
  - name: "googlesql CAST of a BOOL to STRING should spell it out"
    description: "BigQuery CAST(TRUE AS STRING) is 'true'; sqly returns '1'. SQLite has no boolean type, so TRUE is already the integer 1 by the time the cast runs and nothing downstream can tell it from a plain 1. Fixing this needs type inference over the whole expression, not a cast rule."
    steps:
      - run:
          command: sqly --csv --dialect bigquery --sql "SELECT CAST(TRUE AS STRING) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "true"
