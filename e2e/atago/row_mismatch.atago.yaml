# End-to-end coverage for --row-mismatch / .row-mismatch, which chooses how a
# CSV/TSV row whose field count differs from the header is imported: error
# (default), skip, or pad. Regression for nao1215/sqly#731, where such a row
# silently produced an empty table. make test-e2e
version: "1"

suite:
  name: sqly row-mismatch handling

scenarios:
  - name: default policy stops the import and reports the column mismatch
    steps:
      - fixture: &ragged
          file: ragged.csv
          content: |
            id,name,zip
            1,alice,01234
            2,bob,00123
            3,caro
      - run:
          command: sqly --output-format json --sql "SELECT name FROM ragged" ragged.csv
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains:
              - "failed to import"
              - "column count mismatch"

  - name: --row-mismatch skip drops the ragged row and imports the rest
    steps:
      - fixture: *ragged
      - run:
          command: sqly --row-mismatch skip --output-format csv --sql "SELECT name FROM ragged ORDER BY id" ragged.csv
      - assert:
          exit_code: 0
          stdout:
            contains:
              - alice
              - bob
      - assert:
          stdout:
            not_contains: caro

  - name: --row-mismatch pad keeps every row and blanks the missing field
    steps:
      - fixture: *ragged
      - run:
          command: sqly --row-mismatch pad --output-format csv --sql "SELECT name FROM ragged ORDER BY id" ragged.csv
      - assert:
          exit_code: 0
          stdout:
            contains:
              - alice
              - bob
              - caro

  - name: --row-mismatch pad rejects a long row instead of truncating it
    steps:
      - fixture:
          file: too_many_fields.csv
          content: |
            id,name
            1,alice,unexpected
      - run:
          command: sqly --row-mismatch pad --sql "SELECT * FROM too_many_fields" too_many_fields.csv
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "--row-mismatch pad refuses to truncate"

  - name: an invalid --row-mismatch value is rejected
    steps:
      - run:
          command: sqly --row-mismatch keep --sql "SELECT 1"
      - assert:
          exit_code: 2
          stderr:
            contains: "invalid row-mismatch policy"

  - name: .row-mismatch changes the policy for a later batch .import
    steps:
      - fixture: *ragged
      - run:
          command: sqly
          stdin: ".row-mismatch pad\n.import ragged.csv\nSELECT name FROM ragged ORDER BY id;\n"
      - assert:
          exit_code: 0
          stdout:
            contains:
              - alice
              - caro
          stderr:
            contains: "Change row-mismatch policy from error to pad"

  # .row-mismatch alone reports the policy in effect and succeeds, the way
  # .mode and .dialect do. A policy name that is wrong is still rejected.
  - name: .row-mismatch with no argument reports the current policy
    steps:
      - run:
          command: sqly
          stdin: ".row-mismatch\n"
      - assert:
          exit_code: 0
          stdout:
            equals: ""
      - assert:
          stderr:
            contains: "current row-mismatch policy: error (available: error, skip, pad)"

  # The policy only applies to delimited text (CSV/TSV). The scenarios below pin
  # down that it is a no-op for every other format: LTSV, JSON, JSONL, Parquet,
  # and Excel import their data unchanged under stop, skip, and pad, so a user
  # who sets the flag on a non-delimited input sees no surprising behavior.

  - name: rejects an explicit policy when no input is csv or tsv
    # The policy only decides what happens to a csv/tsv row, so a run whose
    # inputs cannot have that problem would accept the flag and never use it.
    steps:
      - fixture:
          file: docs.jsonl
          content: |
            {"id":1}
      - run:
          command: sqly --row-mismatch skip --sql "SELECT 1" docs.jsonl
      - assert:
          exit_code: 2
          stdout:
            equals: ""
          stderr:
            contains: "--row-mismatch"

  - name: accepts an explicit policy when one of several inputs is csv
    steps:
      - fixture:
          file: docs.jsonl
          content: |
            {"id":1}
      - fixture:
          file: rows.csv
          content: |
            a,b
            1,2
      - run:
          command: sqly --row-mismatch skip --output-format csv --sql "SELECT COUNT(*) AS c FROM rows" docs.jsonl rows.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "1"

  - name: rejects an explicit encoding when no input is text
    steps:
      - fixture:
          file: docs.jsonl
          content: |
            {"id":1}
      - run:
          command: sqly --encoding shift-jis --sql "SELECT 1" docs.jsonl
      - assert:
          exit_code: 0
