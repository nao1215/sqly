# The human-readable formats of --compare and --profile used to carry less than
# the machine-readable ones. `--compare-format text` printed only counts — "1
# added, 1 removed, 1 modified" — while the JSON it was summarizing held the
# whole diff, so the format meant for a person was the one that could not answer
# "what changed?". `--profile-format text` printed every column, so on the wide
# CSV sqly exists for (hundreds of columns) the two that had warnings were buried
# in three hundred lines.
# Run with: make test-e2e
version: "1"

suite:
  name: sqly human-readable reports

scenarios:
  - name: compare text names the rows that changed
    steps:
      - fixture:
          file: before.csv
          content: |
            id,name,salary
            1,alice,100
            2,bob,200
            3,carol,300
      - fixture:
          file: after.csv
          content: |
            id,name,salary
            1,alice,100
            2,bob,999
            4,dave,400
      - run:
          command: sqly --compare --compare-key id --compare-format text before.csv after.csv
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "keyed by id: 1 added, 1 removed, 1 modified"
              - "+ id=4"
              - "- id=3"
              - "~ id=2"
              - "salary: 200 -> 999"

  - name: compare text shows only the columns that differ in a modified row
    steps:
      - fixture:
          file: l.csv
          content: |
            id,a,b,c
            1,keep,old,same
      - fixture:
          file: r.csv
          content: |
            id,a,b,c
            1,keep,new,same
      - run:
          command: sqly --compare --compare-key id --compare-format text l.csv r.csv
      - assert:
          exit_code: 0
          stdout:
            contains: "b: old -> new"
            not_contains:
              - "a: keep"
              - "c: same"

  - name: compare text stays quiet when nothing changed
    steps:
      - fixture: &same
          file: x.csv
          content: |
            id,v
            1,a
      - fixture:
          file: y.csv
          content: |
            id,v
            1,a
      - run:
          command: sqly --compare --compare-key id --compare-format text x.csv y.csv
      - assert:
          exit_code: 0
          stdout:
            contains: "keyed by id: 0 added, 0 removed, 0 modified"
            not_contains:
              - "+ id="
              - "- id="
              - "~ id="

  - name: profile text leads with the columns that have warnings
    steps:
      - fixture:
          file: data.csv
          content: |
            good,mixed,blanks
            1,1,x
            2,N/A,
            3,3,z
      - run:
          command: sqly --profile --profile-format text data.csv
      - assert:
          exit_code: 0
          stdout:
            contains:
              # A blank cell is counted but is not itself a warning, so only the
              # mixed-type column is flagged.
              - "1 of 3 columns have warnings"
              - "mixed (TEXT)"
              - "mixed numeric and non-numeric"

  - name: profile text still reports every column
    steps:
      - fixture:
          file: data.csv
          content: |
            good,mixed,blanks
            1,1,x
            2,N/A,
            3,3,z
      - run:
          command: sqly --profile --profile-format text data.csv
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "good (INTEGER)"
              - "table data: 3 rows, 3 columns"

  - name: profile text says so when nothing is wrong
    steps:
      - fixture:
          file: clean.csv
          content: |
            id,v
            1,10
            2,20
      - run:
          command: sqly --profile --profile-format text clean.csv
      - assert:
          exit_code: 0
          stdout:
            contains: "no warnings"
            not_contains: "columns have warnings"
