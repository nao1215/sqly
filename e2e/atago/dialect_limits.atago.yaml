# What --dialect does NOT do. Translation is best-effort: a construct with no
# SQLite equivalent is rejected by name, but SQL that SQLite happens to accept is
# passed through and runs with SQLite's semantics, which can differ from the
# source dialect's without any error.
#
# Every scenario here pins the behavior sqly has today, and every claim on the
# documentation's dialect page comes from one of them. A scenario that starts
# failing means the page needs updating — or that a limit became a fix.
# Run with: make test-e2e
version: "1"

suite:
  name: sqly dialect limits

scenarios:
  # ---- Rejected by name: a clear error, not a confusing SQLite parse failure.
  - name: an unsupported construct is named rather than passed to SQLite
    steps:
      - fixture: &rows
          file: t.csv
          content: |
            id,g,v
            1,a,10
            2,a,20
            3,b,30
      - run:
          command: sqly --dialect postgresql --sql "SELECT DISTINCT ON (g) g, v FROM t" t.csv
      - assert:
          exit_code: 1
          stderr:
            contains: "DISTINCT ON is not supported"

  - name: a non-aggregated column in GROUP BY is named rather than answered
    description: >
      This was a limit until filesql v0.57.0: SQLite picks an arbitrary row from
      each group, so sqly answered where MySQL, which runs with
      ONLY_FULL_GROUP_BY, rejects the query. It is rejected here now, naming the
      column that is neither grouped nor aggregated. PostgreSQL and BigQuery
      reject it too, so the refusal holds under those dialects as well.
    steps:
      - fixture: *rows
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT g, v FROM t GROUP BY g" t.csv
      - assert:
          exit_code: 1
          stderr:
            contains: "v is neither grouped nor aggregated"

  - name: grouping every column selected still answers
    description: >
      The refusal above is narrow: a query that groups what it selects is
      unaffected, and so is one that aggregates the rest.
    steps:
      - fixture: *rows
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT g, count(*) AS n FROM t GROUP BY g" t.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "a,2"

  # ---- Passed through: SQLite runs it, and the answer can differ silently.
  - name: string comparison stays case-sensitive under mysql
    description: >
      MySQL's default collation is case-insensitive, so 'A' = 'a' is 1 there.
      SQLite compares bytes, and a collation is not something a query rewrite can
      supply, so the comparison keeps SQLite's answer.
    steps:
      - fixture: *rows
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT 'A' = 'a' AS eq" t.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "0"

  - name: googlesql SUBSTR from position 0 answers BigQuery's rule
    description: >
      This was a limit until a BigQuery to check against turned up: all three
      dialects now answer their own way, and BigQuery's is a third rule again.
      Position 0 means position 1, so two characters from the start is "ab",
      where MySQL gives the empty string and PostgreSQL gives "a".
    steps:
      - fixture: *rows
      - run:
          command: sqly --output-format csv --dialect googlesql --sql "SELECT SUBSTR('abc', 0, 2) AS x" t.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: ab

  - name: casting a boolean literal to text spells the word, and a column of ones does not
    description: >
      BigQuery CAST(TRUE AS STRING) is 'true', and the translation answers it
      where the expression is syntactically a boolean. A column loaded from a
      file holds 0 and 1, because SQLite has no boolean type, so CAST(col AS
      STRING) over it stays '1': nothing downstream can tell that column from a
      plain integer one.
    steps:
      - fixture: *rows
      - run:
          command: sqly --output-format csv --dialect googlesql --sql "SELECT CAST(TRUE AS STRING) AS x, CAST(id AS STRING) AS y FROM t" t.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "true,1"

  # ---- The boundary the translation never crosses.
  - name: loading a file always uses sqlite, whatever the query dialect
    steps:
      - fixture: *rows
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT COUNT(*) AS c FROM t" t.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "3"
