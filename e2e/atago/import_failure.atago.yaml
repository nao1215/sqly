# Migrated from sqly's ShellSpec spec/import_failure_spec.sh.
# When an input fails to import, the whole import fails: no table from a
# readable input is left behind, the run exits 3, and diagnostics stay on stderr
# so stdout stays clean. make test-e2e
#
# The rollback scenarios put the unreadable file first, in the middle, and last.
# Middle and last are the ones that prove anything: they are the positions where
# readable files were already loaded when the failure happened.
version: "1"

suite:
  name: sqly import failure handling

scenarios:
  - name: fails query mode when one input cannot be read, and keeps stdout clean
    steps:
      - fixture: &user
          file: user.csv
          content: |
            user_name,identifier
            booker12,1
      - run:
          command: sqly --output-format json --sql "SELECT user_name FROM user LIMIT 1" user.csv /no/such/file.csv
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains:
              - "no table was created or changed"
              - "path does not exist"

  - name: stops at the first unreadable path and names it
    steps:
      - run:
          command: sqly --sql "SELECT 1" /no/such/a.csv /no/such/b.csv
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains:
              - "no table was created or changed"
              - "/no/such/a.csv"
      - assert:
          # The import stops at the first input it cannot read, so the second is
          # never opened and has nothing to report.
          stderr:
            not_contains: "/no/such/b.csv"

  - name: fails --inspect when one input cannot be read
    steps:
      - fixture: *user
      - run:
          command: sqly --inspect user.csv /no/such/file.csv
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "no table was created or changed"

  - name: a failed batch .import leaves no table and stops later commands
    steps:
      - fixture: *user
      - run:
          command: sqly
          stdin: ".import user.csv /no/such/file.csv\n.tables\n"
      - assert:
          exit_code: 3
          stdout:
            not_contains: "TABLE NAME"
          stderr:
            contains: "no table was created or changed"

  - name: keeps stdout clean when a stdin dataset fails to import
    steps:
      - run:
          command: sqly --stdin-format csv --output-format json --sql "SELECT COUNT(*) FROM stdin"
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "no table was created or changed"

  # Two inputs sqly cannot read at all, with no flag that changes the answer.
  # Both are documented on the formats page as unreadable, so both are pinned
  # here: a later change that starts accepting one is a documentation change too.
  - name: refuses a CSV whose header repeats a column name
    steps:
      - fixture:
          file: dup.csv
          content: |
            a,a
            1,2
      - run:
          command: sqly --sql "SELECT 1" dup.csv
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "filesql: duplicate column name: a"

  - name: refuses a file with nothing in it
    steps:
      - fixture:
          file: empty.csv
          content: ""
      - run:
          command: sqly --sql "SELECT 1" empty.csv
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "filesql: empty data source: file is empty"

  # The contrast that makes the two above a rule rather than a surprise: a file
  # holding only a header is a table with no rows, not an unreadable file.
  - name: reads a header-only file as a table with no rows
    steps:
      - fixture:
          file: hdronly.csv
          content: |
            a,b
      - run:
          command: sqly --output-format json --sql "SELECT * FROM hdronly" hdronly.csv
      - assert:
          exit_code: 0
          stdout:
            contains: "[]"
