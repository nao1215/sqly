# Migrated from sqly's ShellSpec spec/parquet_export_spec.sh.
# Parquet is export-only: written by .dump and --output, re-imports cleanly,
# normalizes the extension, and errors on an empty result. Round-trips use two
# run steps (write, then re-import); each assert targets the most recent run.
# Run with: make test-e2e
version: "1"

suite:
  name: sqly parquet export

scenarios:
  - name: writes a parquet file that re-imports with the same rows
    steps:
      - fixture: &user
          file: user.csv
          content: |
            user_name,identifier
            booker12,1
            jenkins46,2
            grey07,3
      - run:
          command: sqly user.csv
          stdin: ".dump user user.parquet\n"
      - assert:
          exit_code: 0
          file:
            path: user.parquet
            exists: true
      - run:
          command: sqly --output-format csv --sql "SELECT COUNT(*) AS c FROM user" user.parquet
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "3"

  - name: refuses .mode parquet, since a screen cannot show one
    steps:
      - fixture: *user
      - run:
          command: sqly user.csv
          stdin: ".mode parquet\n"
      - assert:
          exit_code: 2
          stderr:
            contains:
              - "invalid output mode"
              - ".dump"

  - name: writes query results to the given parquet path with --output
    steps:
      - fixture: *user
      - run:
          command: sqly --output-format parquet --output q.parquet --sql "SELECT user_name FROM user LIMIT 2" user.csv
      - assert:
          exit_code: 0
          stderr:
            contains: q.parquet
          file:
            path: q.parquet
            exists: true

  - name: preserves leading-zero codes through a parquet round-trip
    steps:
      - run:
          command: sqly --output-format parquet --output codes.parquet --sql "SELECT '007' AS code, '00042' AS acct"
      - run:
          command: sqly --output-format csv --sql "SELECT code, acct FROM codes" codes.parquet
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "007"
              - "00042"

  - name: preserves SQL NULL through a parquet round-trip
    steps:
      - run:
          command: sqly --output-format parquet --output n.parquet --sql "SELECT CAST(NULL AS TEXT) AS id, 'A' AS name UNION ALL SELECT '1' AS id, 'B' AS name"
      - run:
          command: sqly --output-format json --sql "SELECT * FROM n" n.parquet
      - assert:
          exit_code: 0
          stdout:
            contains: '"id":null'
      - assert:
          stdout:
            not_contains: '"id":""'

  # A column that mixes numbers with text is staged as TEXT; binding the driver's
  # number let SQLite render it, and a result printed as 100000 came back 100000.0.
  - name: a column staged as text exports the number sqly displayed
    steps:
      - fixture:
          file: mixed.csv
          content: |
            n,k
            1e5,a
            ,b
      - run:
          command: sqly --output-format csv --sql "SELECT n FROM mixed ORDER BY k" mixed.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              n
              100000
              ""
      - run:
          command: sqly --output-format parquet --output mixed.parquet --sql "SELECT n, k FROM mixed ORDER BY k" mixed.csv
      - assert:
          exit_code: 0
      - run:
          command: sqly --output-format csv --sql "SELECT n FROM mixed ORDER BY k" mixed.parquet
      - assert:
          exit_code: 0
          stdout:
            equals: |
              n
              100000
              ""

  # Parquet is the only format with a number type wide enough for an infinity.
  # sqly wrote a genuine double, but reading it back gave text: filesql rendered
  # a non-finite double as "+Inf", which SQLite's REAL affinity cannot read, so
  # the value landed as text in a column declared REAL.
  - name: an infinity survives a parquet round trip as a real
    steps:
      - fixture: *user
      - run:
          command: sqly --output inf.parquet --sql "SELECT 1e308*10 AS big" user.csv
      - assert:
          exit_code: 0
      - run:
          command: sqly --output-format csv --sql "SELECT big, typeof(big) AS t FROM inf" inf.parquet
      - assert:
          exit_code: 0
          stdout:
            contains: "Infinity,real"

  - name: reports a clear error when exporting an empty result
    steps:
      - fixture: *user
      - run:
          command: sqly --output-format parquet --output empty.parquet --sql "SELECT user_name FROM user WHERE 1=0" user.csv
      - assert:
          exit_code: 4
          stderr:
            contains: "empty result"
