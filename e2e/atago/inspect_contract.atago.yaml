# The --inspect JSON contract, run against the real binary.
#
# --inspect exists to be parsed by something that is not a person, so its promises
# are about bytes: what is sorted, what order rows come in, and how a value that
# JSON has no spelling for is written down. Each scenario below pins one of them.
#
# Documented at website/content/reference.md#inspection.
version: "1"

suite:
  name: sqly --inspect JSON contract

scenarios:
  - name: sorts tables by name regardless of the order they were given
    env: &hist
      SQLY_HISTORY_PATH: "${workdir}/history"
    steps:
      - fixture: &abc
          file: c.csv
          content: |
            v
            3
      - fixture:
          file: a.csv
          content: |
            v
            1
      - fixture:
          file: b.csv
          content: |
            v
            2
      - run:
          command: sqly --inspect c.csv b.csv a.csv
      - assert:
          exit_code: 0
          stdout:
            matches: '(?s)"name": "a".*"name": "b".*"name": "c"'

  - name: keeps columns in the file's order, not alphabetical order
    env: *hist
    steps:
      - fixture:
          file: cols.csv
          content: |
            zebra,alpha,middle
            1,2,3
      - run:
          command: sqly --inspect cols.csv
      - assert:
          exit_code: 0
          stdout:
            matches: '(?s)"name": "zebra".*"name": "alpha".*"name": "middle"'

  - name: samples the first rows of the file, in file order
    env: *hist
    steps:
      - fixture:
          file: ordered.csv
          content: |
            v
            first
            second
            third
            fourth
      - run:
          command: sqly --inspect --inspect-sample 2 ordered.csv
      - assert:
          exit_code: 0
          stdout:
            matches: '(?s)"sample_rows": \[\s*\{\s*"v": "first"\s*\},\s*\{\s*"v": "second"\s*\}\s*\]'

  - name: gives the same bytes on two runs over the same inputs
    env: *hist
    steps:
      - fixture:
          file: stable.csv
          content: |
            a,b
            1,x
            2,y
      - run:
          command: sqly --inspect stable.csv --output-format table
      - assert:
          exit_code: 2
      - run:
          command: sh -c "sqly --inspect stable.csv > one.json && sqly --inspect stable.csv > two.json && cmp one.json two.json"
          shell: true
      - assert:
          exit_code: 0

  - name: reports an empty sample array rather than omitting the field
    env: *hist
    steps:
      - fixture:
          file: schema.csv
          content: |
            a
            1
      - run:
          command: sqly --inspect --inspect-sample 0 schema.csv
      - assert:
          exit_code: 0
          stdout:
            contains: '"sample_rows": []'

  - name: distinguishes an empty CSV field from a SQL NULL
    env: *hist
    steps:
      - fixture:
          file: blank.csv
          content: |
            a,b
            ,x
      - run:
          command: sqly --inspect --inspect-sample 1 blank.csv
      - assert:
          exit_code: 0
          stdout:
            contains: '"a": ""'
      - assert:
          stdout:
            not_contains: '"a": null'

  - name: emits a 64-bit integer in full
    env: *hist
    steps:
      - fixture:
          file: big.csv
          content: |
            n
            9223372036854775807
      - run:
          command: sqly --inspect --inspect-sample 1 big.csv
      - assert:
          exit_code: 0
          stdout:
            contains: "9223372036854775807"

  # The value arrives through Parquet, which states its own types and is not
  # UTF-8-validated the way a text input is: filesql v0.36.0 refuses a CSV that
  # is not UTF-8, so a text file can no longer carry such a value in, while a
  # binary container still can. What --inspect owes the reader is unchanged — a
  # document that parses, whatever the sample holds.
  - name: replaces bytes that are not valid UTF-8 rather than emitting invalid JSON
    env: *hist
    steps:
      - fixture:
          file: seed.csv
          content: |
            a
            1
      - fixture:
          file: bad.sql
          content: |
            SELECT CAST(x'626164ff62797465' AS TEXT) AS v;
      - run:
          command: sqly --output bad.parquet --output-format parquet --sql-file bad.sql seed.csv
      - assert:
          exit_code: 0
      - run:
          command: sh -c "sqly --inspect --inspect-sample 1 bad.parquet | python3 -c 'import json,sys; json.load(sys.stdin)'"
          shell: true
      - assert:
          exit_code: 0

  - name: writes an infinity as a JSON string instead of failing the output
    env: *hist
    steps:
      - fixture:
          file: any.csv
          content: |
            a
            1
      - run:
          command: sqly --output-format json --sql "SELECT 9e999 AS inf, -9e999 AS ninf" any.csv
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"inf":"Infinity"'
              - '"ninf":"-Infinity"'

  - name: base64-encodes a BLOB that is not valid UTF-8
    env: *hist
    steps:
      - fixture:
          file: any.csv
          content: |
            a
            1
      - run:
          command: sqly --output-format json --sql "SELECT x'00ff41' AS b" any.csv
      - assert:
          exit_code: 0
          stdout:
            contains: '"b":"AP9B"'

  - name: leaves a BLOB that is valid UTF-8 readable
    env: *hist
    steps:
      - fixture:
          file: any.csv
          content: |
            a
            1
      - run:
          command: sqly --output-format json --sql "SELECT x'414243' AS b" any.csv
      - assert:
          exit_code: 0
          stdout:
            contains: '"b":"ABC"'

  - name: writes a SQL NULL as null and keeps a numeric string a string
    env: *hist
    steps:
      - fixture:
          file: typed.csv
          content: |
            t
            00123
      - run:
          command: sqly --output-format json --sql "SELECT t, NULL AS n FROM typed" typed.csv
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"t":"00123"'
              - '"n":null'

  - name: prints the report and nothing else on stdout
    env: *hist
    steps:
      - fixture:
          file: quiet.csv
          content: |
            a
            1
      - run:
          command: sh -c "sqly --inspect quiet.csv | python3 -c 'import json,sys; print(len(json.load(sys.stdin)[\"tables\"]))'"
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains: "1"

  # A pipe cannot be told apart from an empty one without reading it, and reading
  # it is what hangs, so the run continues and stderr carries the notice.
  - name: says on stderr that a dataset piped in without --stdin-format went unread
    env: *hist
    steps:
      - fixture:
          file: other.csv
          content: |
            a
            1
      - run:
          command: sqly --inspect other.csv
          stdin: "a\n2\n"
      - assert:
          exit_code: 0
          stderr:
            contains: "--stdin-format"
      - assert:
          stdout:
            contains: '"name": "other"'
            not_contains: '"name": "stdin"'

  - name: inspects a piped dataset when --stdin-format claims it
    env: *hist
    steps:
      - run:
          command: sqly --stdin-format csv --inspect
          stdin: "a\n2\n"
      - assert:
          exit_code: 0
          stdout:
            contains: '"name": "stdin"'

  # A workbook is named twice in the report: once as the source of each table it
  # produced, and once as the source of each sheet it held. The two have to be
  # the same string, or nothing can join them. tables[].source was made absolute
  # and excel_sheets[].source was left as typed, so `sqly --inspect book.xlsx`
  # answered "/abs/path/book.xlsx" and "book.xlsx" for the same file.
  #
  # The invariant is checked rather than the literal path: the workdir is a temp
  # directory whose name is not known here, and on macOS it is reached through a
  # symlink, so the absolute path sqly computes is not the one the spec could
  # spell. What matters is that the two fields agree and that the answer does not
  # depend on how the workbook was spelled on the command line.
  - name: spells a workbook the same way in excel_sheets and in tables
    skip:
      os: windows
    env: *hist
    steps:
      - fixture: &workbook
          file: book.xlsx
          from: testdata/sheets_visibility.xlsx
      - fixture: &sourcecheck
          file: check.py
          content: |
            import json

            def sources(doc, key):
                return sorted({row["source"] for row in doc.get(key, [])})

            docs = {label: json.load(open(path)) for label, path in
                    (("relative", "rel.json"), ("dot", "dot.json"), ("absolute", "abs.json"))}
            sheets = {label: sources(doc, "excel_sheets") for label, doc in docs.items()}
            tables = {label: sources(doc, "tables") for label, doc in docs.items()}

            spelled = list(sheets.values())
            print("identical" if spelled[0] == spelled[1] == spelled[2] else "differ: {}".format(sheets))
            print("matches-tables" if all(sheets[k] == tables[k] for k in docs) else
                  "unmatched: {} vs {}".format(sheets, tables))
            print("absolute" if all(s.startswith("/") for s in spelled[0]) else "not-absolute: {}".format(spelled[0]))
            print("one-source" if all(len(v) == 1 for v in spelled) else "split: {}".format(sheets))
      - run:
          command: sh -c 'sqly --inspect book.xlsx > rel.json; sqly --inspect ./book.xlsx > dot.json; sqly --inspect "$PWD/book.xlsx" > abs.json; python3 check.py'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains:
              - identical
              - matches-tables
              - absolute
              - one-source

  # A directory import reaches the same workbook through a path nobody typed, so
  # it is the case where "as the user wrote it" has no answer at all.
  - name: spells a workbook found through a directory the same way in both fields
    skip:
      os: windows
    env: *hist
    steps:
      - fixture:
          file: xl/book.xlsx
          from: testdata/sheets_visibility.xlsx
      - fixture:
          file: check_dir.py
          content: |
            import json

            doc = json.load(open("dir.json"))
            sheets = sorted({row["source"] for row in doc.get("excel_sheets", [])})
            tables = sorted({row["source"] for row in doc.get("tables", [])})
            print("matches-tables" if sheets == tables else "unmatched: {} vs {}".format(sheets, tables))
            print("absolute" if all(s.startswith("/") for s in sheets) else "not-absolute: {}".format(sheets))
      - run:
          command: sh -c 'sqly --inspect xl/ > dir.json; python3 check_dir.py'
          shell: true
      - assert:
          exit_code: 0
          stdout:
            contains:
              - matches-tables
              - absolute
