# Migrated from sqly's ShellSpec spec/history_tolerance_spec.sh.
# Non-interactive runs must succeed even when the history file cannot be created.
# The history file path is pointed (via scenario env + ${workdir}) at a directory
# that does not exist, so creating it fails the way a read-only/sandboxed config
# location would. Run with: make test-e2e
#
# The "read-only after startup" group seeds a history file (a first run creates
# it) and then makes it 0444 with a mode-only fixture (fixture.mode applied to an
# existing file), simulating a history file that turned read-only mid-session.
version: "1"

suite:
  name: sqly history tolerance

scenarios:
  - name: runs --sql and warns instead of failing
    env: &histenv
      SQLY_HISTORY_PATH: "${workdir}/missing/history"
    steps:
      - fixture: &actor
          file: actor.csv
          content: |
            actor
            Adam Sandler
            Harrison Ford
      - run:
          command: sqly --output-format csv --sql "SELECT actor FROM actor ORDER BY actor LIMIT 1" actor.csv
      - assert:
          exit_code: 0
          stdout:
            contains: "Adam Sandler"
          stderr:
            contains: "history disabled"

  - name: runs batch mode without a writable history file
    env: *histenv
    steps:
      - fixture: *actor
      - run:
          command: sqly actor.csv
          stdin: ".tables\nSELECT actor FROM actor ORDER BY actor LIMIT 1\n"
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "TABLE NAME"
              - "Adam Sandler"
          stderr:
            contains: "history disabled"

  - name: runs --sql when the history file is read-only after startup
    env: &roenv
      SQLY_HISTORY_PATH: "${workdir}/h"
    steps:
      - fixture: &user
          file: user.csv
          content: |
            user_name,identifier
            booker12,1
            jenkins46,2
      # First run seeds a valid, writable history file at ${workdir}/h.
      - run:
          command: sqly --sql "SELECT 1" user.csv
      # Make the seeded DB read-only (mode-only fixture modifies the existing file).
      - fixture:
          file: h
          mode: "0444"
      - run:
          command: sqly --sql "SELECT user_name FROM user ORDER BY identifier LIMIT 1" user.csv
      - assert:
          exit_code: 0
          stdout:
            contains: booker12

  - name: runs --inspect when the history file is read-only after startup
    env: *roenv
    steps:
      - fixture: *user
      - run:
          command: sqly --sql "SELECT 1" user.csv
      - fixture:
          file: h
          mode: "0444"
      - run:
          command: sqly --inspect user.csv
      - assert:
          exit_code: 0
          stdout:
            line: 1
            equals: "{"
      - assert:
          stdout:
            contains: '"name": "user"'

  - name: runs batch mode and warns when a history write fails after startup
    env: *roenv
    steps:
      - fixture: *user
      - run:
          command: sqly --sql "SELECT 1" user.csv
      - fixture:
          file: h
          mode: "0444"
      - run:
          command: sqly user.csv
          stdin: "SELECT user_name FROM user ORDER BY identifier LIMIT 1\n"
      - assert:
          exit_code: 0
          stdout:
            contains: booker12
          stderr:
            contains: "history disabled"

  # History is a text file now, one entry per line, so what a session typed can
  # be read back with anything. It was a second SQLite database, which cost a
  # busy timeout, a five-file layer stack, and a lock two sqly processes fought
  # over for what an append already gives.
  - name: history is a readable text file, one entry per line
    env: &textenv
      SQLY_HISTORY_PATH: "${workdir}/history"
    steps:
      - fixture: &small
          file: t.csv
          content: |
            id
            1
      - run:
          command: sqly t.csv
          stdin: "SELECT 1;\nSELECT 2;\n"
      - assert:
          exit_code: 0
      - run:
          command: sh -c 'cat "$SQLY_HISTORY_PATH"'
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "SELECT 1"
              - "SELECT 2"

  - name: a later session recalls what an earlier one typed
    env: *textenv
    steps:
      - fixture: *small
      - run:
          command: sqly t.csv
          stdin: "SELECT 42;\n"
      - assert:
          exit_code: 0
      - run:
          command: sh -c 'cat "$SQLY_HISTORY_PATH"'
      - assert:
          exit_code: 0
          stdout:
            contains: "SELECT 42"

  - name: a multi-line statement is kept on one line
    env: *textenv
    steps:
      - fixture: *small
      - run:
          command: sqly t.csv
          stdin: "SELECT 1,\n2;\n"
      - assert:
          exit_code: 0
      - run:
          command: sh -c 'wc -l < "$SQLY_HISTORY_PATH"'
      - assert:
          exit_code: 0
          stdout:
            contains: "1"
