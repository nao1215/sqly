# Setting a mode to the value it already has is a no-op, not a failure. It used
# to return an error, which in a script is fatal: `sqly --output-format csv data.csv` fed a
# batch that opens with `.mode csv` died on the first line before running
# anything, and so did any script that set a mode defensively before using it.
# Run with: make test-e2e
version: "1"

suite:
  name: sqly mode commands are idempotent

scenarios:
  - name: .mode to the current mode is accepted and changes nothing
    steps:
      - fixture: &rows
          file: t.csv
          content: |
            id,v
            1,a
      - run:
          command: sqly t.csv
          stdin: ".mode table\nSELECT v FROM t;\n"
      - assert:
          exit_code: 0
          stdout:
            contains: "+---+"
          stderr:
            not_contains: "Change output mode"

  - name: .mode repeated after a real switch still runs the query
    steps:
      - fixture: *rows
      - run:
          command: sqly t.csv
          stdin: ".mode csv\n.mode csv\nSELECT v FROM t;\n"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: a
      - assert:
          stderr:
            contains: "Change output mode from table to csv"

  # The combination that makes this fatal in practice: the flag picks the mode,
  # and the script names the same one.
  - name: a script may restate the mode the flag already selected
    steps:
      - fixture: *rows
      - run:
          command: sqly --output-format csv t.csv
          stdin: ".mode csv\nSELECT v FROM t;\n"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: a

  - name: .row-mismatch to the current policy is accepted and changes nothing
    steps:
      - fixture: *rows
      - run:
          command: sqly t.csv
          stdin: ".row-mismatch error\nSELECT v FROM t;\n"
      - assert:
          exit_code: 0
          stdout:
            contains: a
          stderr:
            not_contains: "Change import mode"

  - name: a script may restate the import mode the flag already selected
    steps:
      - fixture:
          file: ragged.csv
          content: |
            id,v
            1,a
            2,b,extra
      - run:
          command: sqly --output-format csv --row-mismatch skip ragged.csv
          stdin: ".row-mismatch skip\nSELECT COUNT(*) AS c FROM ragged;\n"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "1"

  # A name that is not a mode at all must still be reported.
  - name: an unknown mode is still rejected
    steps:
      - fixture: *rows
      - run:
          command: sqly t.csv
          stdin: ".mode nope\n"
      - assert:
          exit_code: 2
          stderr:
            contains: 'invalid output mode "nope"'

  - name: an unknown row-mismatch policy is still rejected
    steps:
      - fixture: *rows
      - run:
          command: sqly t.csv
          stdin: ".row-mismatch nope\n"
      - assert:
          exit_code: 2
