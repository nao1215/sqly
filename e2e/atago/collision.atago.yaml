# Migrated from sqly's ShellSpec spec/collision_spec.sh.
# Two inputs that sanitize to the same table name must fail instead of one
# silently overwriting the other. Run with: make test-e2e
version: "1"

suite:
  name: sqly table-name collision

scenarios:
  - name: fails when two inputs sanitize to the same table name
    steps:
      - fixture:
          file: a-b.csv
          content: |
            id,name
            1,A
      - fixture:
          file: a_b.csv
          content: |
            id,name
            2,B
      - run:
          command: sqly --inspect a-b.csv a_b.csv
      - assert:
          exit_code: 3
          stderr:
            contains: collision

  # A staged --stdin-format dataset lives at a random temp path. Naming it in the
  # collision was an answer nobody could act on: the reader cannot rename that
  # file, and it is gone by the time they read about it. Import failures already
  # called it "stdin (--stdin-format csv)"; the pre-import checks did not.
  - name: names standard input as stdin when it collides with a file
    # Needs a POSIX shell for the stdin redirect; the message itself is not
    # platform-specific and is covered by the Go tests.
    skip:
      os: windows
    steps:
      - fixture:
          file: staff.csv
          content: |
            id,name
            1,A
      - run:
          command: sh -c 'sqly --stdin-format csv --stdin-table staff --sql "SELECT 1" staff.csv < staff.csv'
          shell: true
      - assert:
          exit_code: 3
          stderr:
            contains:
              - "table-name collision"
              - "stdin (--stdin-format csv)"
              - "staff.csv"
      - assert:
          stderr:
            not_contains: "sqly-stdin-"
