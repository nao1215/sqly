# Migrated from sqly's ShellSpec spec/excel_export_spec.sh.
# Exported .xlsx files are ordinary data files. Run with: make test-e2e
#
version: "1"

suite:
  name: sqly excel export

scenarios:
  - name: writes a non-executable .xlsx with --output
    steps:
      - fixture: &user
          file: user.csv
          content: |
            user_name,identifier
            booker12,1
      - run:
          command: sqly --output-format excel --output out.xlsx --sql "SELECT * FROM user LIMIT 1" user.csv
      - assert:
          exit_code: 0
          stderr:
            contains: "output mode=excel"
          file:
            path: out.xlsx
            exists: true
      - assert:
          file:
            path: out.xlsx
            executable: false

  - name: writes a non-executable .xlsx with the .dump command
    steps:
      - fixture: *user
      - run:
          command: sqly user.csv
          stdin: ".dump user dump.xlsx\n"
      - assert:
          exit_code: 0
          stderr:
            contains: "mode=excel"
          file:
            path: dump.xlsx
            exists: true
      - assert:
          file:
            path: dump.xlsx
            executable: false

  # excel and parquet name a file, not a screen. .mode used to accept them and
  # then print CSV under the name, with the banner admitting it was "same as csv
  # mode"; a script scraping that output depended on excel meaning csv forever.
  - name: .mode excel is refused and says what to use instead
    steps:
      - fixture: &modegone
          file: user.csv
          content: |
            user_name,identifier
            booker12,1
            jenkins46,2
      - run:
          command: sqly user.csv
          stdin: ".mode excel\n"
      - assert:
          exit_code: 2
          stderr:
            contains:
              - "invalid output mode"
              - ".dump"

  # The extension names the format in a display mode, and only there: a mode that
  # names a different format is a conflict, which is the rule .mode excel used to
  # sidestep by being neither.
  - name: .dump writes a workbook from the extension in every display mode
    matrix:
      - screen: table
      - screen: vertical
    steps:
      - fixture: *modegone
      - run:
          command: sqly user.csv
          stdin: ".mode ${screen}\n.dump user out.xlsx\n"
      - assert:
          exit_code: 0
          file:
            path: out.xlsx
            exists: true
      - run:
          command: sqly --output-format csv --sql "SELECT COUNT(*) AS c FROM out_user" out.xlsx
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "2"

  - name: a mode naming another format still rejects an .xlsx destination
    steps:
      - fixture: *modegone
      - run:
          command: sqly user.csv
          stdin: ".mode csv\n.dump user out.xlsx\n"
      - assert:
          exit_code: 2
          stderr:
            contains: "does not match destination extension"
      - assert:
          file:
            path: out.xlsx
            exists: false

  - name: --output-format excel still names a file format for --output
    steps:
      - fixture: *modegone
      - run:
          command: sqly --output-format excel --output q.xlsx --sql "SELECT user_name FROM user" user.csv
      - assert:
          exit_code: 0
          file:
            path: q.xlsx
            exists: true
