# Dialect behavior that is the same in more than one dialect and differs from
# SQLite's own. Each of these was a silent wrong answer before filesql v0.20.0:
# the query ran and returned a plausible value the source dialect would never
# give, so nothing warned the user.
#
# Run with: make test-e2e
version: "1"

suite:
  name: sqly cross-dialect semantics

scenarios:
  - name: "mysql division should return a float"
    description: "MySQL / is float division, so 5/2 is 2.5. SQLite would return 2 because SQLite does integer division on two integers."
    steps:
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT 5/2 AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "2.5"

  - name: "googlesql division should return a float"
    description: "BigQuery / always yields FLOAT64, so 5/2 is 2.5. SQLite would return 2. This is the worst kind of divergence: an average or a ratio comes out silently truncated."
    steps:
      - run:
          command: sqly --output-format csv --dialect bigquery --sql "SELECT 5/2 AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "2.5"

  - name: "postgresql LIKE should stay case-sensitive"
    description: "PostgreSQL LIKE is case-sensitive and ILIKE is the case-insensitive form. SQLite would report 1 for 'ABC' LIKE 'abc' because SQLite's LIKE folds ASCII case, which also makes ILIKE indistinguishable from LIKE."
    steps:
      - run:
          command: sqly --output-format csv --dialect postgres --sql "SELECT 'ABC' LIKE 'abc' AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "0"

  - name: "googlesql LIKE should stay case-sensitive"
    description: "GoogleSQL LIKE is case-sensitive. SQLite would report 1 for 'ABC' LIKE 'abc', so a filter written against BigQuery silently matches extra rows."
    steps:
      - run:
          command: sqly --output-format csv --dialect bigquery --sql "SELECT 'ABC' LIKE 'abc' AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "0"

  - name: "mysql CAST to an integer type should round"
    description: "MySQL CAST(1.9 AS SIGNED) is 2. SQLite would return 1 because SQLite's CAST truncates toward zero."
    steps:
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT CAST(1.9 AS SIGNED) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "2"

  - name: "postgresql CAST to an integer type should round"
    description: "PostgreSQL CAST(1.9 AS INTEGER) is 2 (round half to even). SQLite would return 1."
    steps:
      - run:
          command: sqly --output-format csv --dialect postgres --sql "SELECT CAST(1.9 AS INTEGER) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "2"

  - name: "googlesql CAST to INT64 should round"
    description: "BigQuery CAST(1.9 AS INT64) is 2 (round half away from zero). SQLite would return 1."
    steps:
      - run:
          command: sqly --output-format csv --dialect bigquery --sql "SELECT CAST(1.9 AS INT64) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "2"

  - name: "LEAST and GREATEST should work in every dialect"
    description: "All three dialects have LEAST/GREATEST. SQLite spells the same idea min/max with several arguments, which collides with the aggregate forms, so each needs its own helper."
    steps:
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT LEAST(3, 1, 2) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "1"
      - run:
          command: sqly --output-format csv --dialect postgres --sql "SELECT GREATEST(3, 1, 2) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "3"
      - run:
          command: sqly --output-format csv --dialect bigquery --sql "SELECT LEAST(3, 1, 2) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "1"

  - name: "CONCAT propagates a NULL where the dialect says it should"
    description: >
      MySQL and GoogleSQL CONCAT return NULL when any argument is NULL.
      SQLite's own concat() treats a NULL as an empty string, so the call used to
      answer a plausible non-NULL string with no error — a query written to find
      rows with a missing field reported them as complete. PostgreSQL's concat()
      genuinely does ignore NULLs, so it keeps SQLite's behavior.
      The NULL reaches CSV as "" — see lone_empty_field.atago.yaml for why a
      blank line will not do.
    steps:
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT CONCAT('a', 'b') AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: ab
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT CONCAT('a', NULL) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: '""'
      - run:
          command: sqly --output-format csv --dialect bigquery --sql "SELECT CONCAT('a', NULL) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: '""'
      - run:
          command: sqly --output-format csv --dialect postgres --sql "SELECT CONCAT('a', NULL) AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: a
      - run:
          command: sqly --output-format csv --dialect mysql --sql "SELECT CONCAT_WS(',', 'a', NULL, 'b') AS v"
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: '"a,b"'
