# Migrated from sqly's ShellSpec spec/stdin_dataset_spec.sh.
# With --stdin-format <format>, piped stdin is imported as a dataset (default table
# "stdin") and can be joined with file arguments. Run with: make test-e2e
version: "1"

suite:
  name: sqly --stdin-format dataset

scenarios:
  - name: queries piped CSV through the default stdin table
    steps:
      - run:
          command: sqly --stdin-format csv --output-format csv --sql "SELECT name FROM stdin ORDER BY id"
          stdin: |
            id,name
            1,alice
            2,bob
      - assert:
          exit_code: 0
          stdout:
            line: 1
            equals: name
      - assert:
          stdout:
            line: 2
            equals: alice
      - assert:
          stdout:
            line: 3
            equals: bob

  - name: queries piped TSV data
    steps:
      - run:
          command: sqly --stdin-format tsv --output-format csv --sql "SELECT COUNT(*) AS c FROM stdin"
          stdin: "id\tname\n1\talice\n"
      - assert:
          exit_code: 0
          stdout:
            contains: "1"

  - name: queries piped JSONL data stored in a data column
    steps:
      - run:
          command: sqly --stdin-format jsonl --output-format csv --sql "SELECT COUNT(*) AS c FROM stdin"
          stdin: |
            {"id":1,"name":"alice"}
            {"id":2,"name":"bob"}
      - assert:
          exit_code: 0
          stdout:
            contains: "2"

  - name: overrides the stdin table name with --stdin-table
    steps:
      - run:
          command: sqly --stdin-format csv --stdin-table people --output-format csv --sql "SELECT COUNT(*) FROM people"
          stdin: |
            id,name
            1,alice
            2,bob
      - assert:
          exit_code: 0
          stdout:
            contains: "2"

  - name: joins piped stdin with an imported file argument
    steps:
      - fixture:
          file: identifier.csv
          content: |
            id,position
            1,developrt
            2,manager
      - run:
          command: sqly --stdin-format csv --output-format csv --sql "SELECT s.name, i.position FROM stdin s JOIN identifier i ON s.id = i.id ORDER BY s.id" identifier.csv
          stdin: |
            id,name
            1,alice
            2,bob
      - assert:
          exit_code: 0
          stdout:
            contains:
              - alice
              - developrt

  - name: reports a stable stdin source in --inspect, not a temp path
    steps:
      - run:
          command: sqly --stdin-format csv --inspect
          stdin: |
            id,name
            1,alice
      - assert:
          exit_code: 0
          stdout:
            contains: '"source": "stdin"'
      - assert:
          stdout:
            not_contains: "sqly-stdin-"

  - name: rejects .save for a stdin-backed table
    steps:
      - fixture:
          file: save.sql
          content: |
            UPDATE stdin SET name = 'x';
            .save --in-place
      - run:
          command: sqly --stdin-format csv --sql-file save.sql
          stdin: |
            id,name
            1,alice
      - assert:
          exit_code: 1
          stdout:
            not_contains: affected
          stderr:
            contains: stdin

  - name: rejects a non-identifier --stdin-table so the name stays queryable
    steps:
      - run:
          command: sqly --stdin-format csv --stdin-table "my data" --sql 'SELECT * FROM "my data"'
          stdin: |
            id,name
            1,alice
      - assert:
          exit_code: 1
          stderr:
            contains: "stdin-table"

  - name: rejects a path-like --stdin-table
    steps:
      - run:
          command: sqly --stdin-format csv --stdin-table "../escaped" --sql "SELECT 1"
          stdin: |
            a
            1
      - assert:
          exit_code: 1
          stderr:
            contains: "stdin-table"
          file:
            path: escaped.csv
            exists: false

  - name: reports a clear error for an unsupported stdin format
    steps:
      - run:
          command: sqly --stdin-format xml --sql "SELECT 1"
          stdin: |
            a,b
            1,2
      - assert:
          exit_code: 1
          stderr:
            contains: "unsupported --stdin-format value"

  - name: still reads stdin as SQL and helper commands without --stdin-format
    steps:
      - fixture:
          file: user.csv
          content: |
            user_name,identifier
            booker12,1
      - run:
          command: sqly user.csv
          stdin: ".tables\nSELECT user_name FROM user ORDER BY identifier LIMIT 1\n"
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "TABLE NAME"
              - booker12
