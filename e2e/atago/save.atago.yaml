# Migrated from sqly's ShellSpec spec/save_spec.sh.
# DML changes persist to files only through .save. `.save --in-place` overwrites
# the sources; `.save DIR` never touches them.
# Run with: make test-e2e
version: "1"

suite:
  name: sqly write-back

scenarios:
  - name: writes to .save DIR without modifying the source
    steps:
      - fixture: &u
          file: u.csv
          content: |
            user_name,identifier,first_name
            booker12,1,Rachel
            jenkins46,2,Mary
      - run:
          command: sqly u.csv
          stdin: |
            UPDATE u SET first_name = 'CHANGED' WHERE identifier = 1;
            .save out
      - assert:
          exit_code: 0
          stdout:
            contains: affected
          stderr:
            contains: "Saved u to"
          file:
            path: u.csv
            not_contains: CHANGED
      - assert:
          file:
            path: out/u.csv
            contains: CHANGED

  - name: overwrites the source in place with .save --in-place
    steps:
      - fixture: *u
      - run:
          command: sqly u.csv
          stdin: |
            DELETE FROM u WHERE identifier > 1;
            .save --in-place
      - assert:
          exit_code: 0
          stdout:
            contains: affected
          stderr:
            contains: "Saved u to"

  - name: re-imports a file rewritten in place (round-trip)
    steps:
      - fixture: *u
      - run:
          command: sqly u.csv
          stdin: |
            DELETE FROM u WHERE identifier > 1;
            .save --in-place
      - run:
          command: sqly --output-format csv --sql "SELECT COUNT(*) AS c FROM u" u.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "1"

  - name: preserves gzip compression on in-place save
    steps:
      - fixture:
          file: c.csv.gz
          from: testdata/user.csv.gz
      - run:
          command: sqly c.csv.gz
          stdin: |
            UPDATE c SET first_name = 'GZ' WHERE identifier = 1;
            .save --in-place
      - run:
          command: sqly --output-format csv --sql "SELECT first_name FROM c WHERE identifier = 1" c.csv.gz
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: GZ

  - name: saves via the .save command in batch mode
    steps:
      - fixture: *u
      - run:
          command: sqly u.csv
          stdin: "UPDATE u SET first_name = 'BATCH' WHERE identifier = 1;\n.save --in-place\n"
      - assert:
          exit_code: 0
          stdout:
            contains: affected
          stderr:
            contains: "Saved u to"
          file:
            path: u.csv
            contains: BATCH

  # A read-only run persists nothing on purpose, so the only thing separating it
  # from a successful write-back is what sqly says. It used to say nothing at all
  # and exit 0, leaving .save DIR looking like it had written the directory.
  - name: reports that a read-only .save DIR run wrote nothing
    steps:
      - fixture: *u
      - run:
          command: sqly u.csv
          stdin: |
            SELECT * FROM u;
            .save out
      - assert:
          exit_code: 0
          stdout:
            contains: booker12
          stderr:
            contains: "no table data changed in this session; nothing to save"
          changes:
            created: []
            modified: []
            deleted: []
      - assert:
          file:
            path: out/u.csv
            exists: false

  - name: reports that a read-only .save --in-place run wrote nothing
    steps:
      - fixture: *u
      - run:
          command: sqly u.csv
          stdin: |
            SELECT COUNT(*) AS c FROM u;
            .save --in-place
      - assert:
          exit_code: 0
          stderr:
            contains: "no table data changed in this session; nothing to save"
            not_contains: "Saved u to"
          changes:
            created: []
            modified: []
            deleted: []

  # A DML statement that matches no row leaves the table as imported, so it takes
  # the same path as a read-only run and must report the same thing rather than
  # rewriting the source with identical content.
  - name: reports that a zero-row UPDATE wrote nothing
    steps:
      - fixture: *u
      - run:
          command: sqly u.csv
          stdin: |
            UPDATE u SET first_name = 'NOPE' WHERE identifier = 999;
            .save --in-place
      - assert:
          exit_code: 0
          stderr:
            contains: "nothing to save"
          file:
            path: u.csv
            not_contains: NOPE
          changes:
            created: []
            modified: []
            deleted: []

  - name: guides a batch .save with no imported tables toward passing input
    steps:
      - run:
          command: sqly
          stdin: ".save --in-place\n"
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "no tables to save"
              - "input files"
