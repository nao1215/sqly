# HTTP/HTTPS input support: sqly downloads supported remote files, imports them,
# and exposes them to both CLI SQL execution and the .import command path. The
# scenarios stay hermetic by serving local fixtures over a temporary localhost
# HTTP server.
#
# Each server is waited for by connecting to its port rather than by sleeping a
# fixed interval. A loaded runner can take longer than any interval worth waiting
# to bind a socket, and the client then gets "connection refused" — a failure that
# says nothing about sqly. Polling ends as soon as the port answers, so the common
# case is also faster than the sleep it replaces.
version: "1"

suite:
  name: HTTP import

scenarios:
  - name: downloads a remote CSV passed as a CLI input argument
    # Needs a POSIX shell and python3 to serve the fixture over HTTP; the
    # download path itself is exercised on Linux and macOS.
    skip:
      os: windows
    steps:
      - fixture:
          file: user.csv
          content: |
            user_name,identifier,first_name,last_name
            booker12,1,Rachel,Booker
            jenkins46,2,Mary,Jenkins
            smith79,3,Jamie,Smith
      - run:
          command: sh -c 'python3 -m http.server 18080 --bind 127.0.0.1 >/tmp/sqly-http-import-cli.log 2>&1 & pid=$!; trap "kill $pid" EXIT; i=0; until python3 -c "import socket,sys; sys.exit(socket.socket().connect_ex((\"127.0.0.1\",18080)))"; do i=$((i+1)); [ $i -ge 50 ] && { echo "the local HTTP fixture never started listening" >&2; exit 1; }; sleep 0.1; done; sqly --allow-remote --output-format csv --sql "SELECT user_name FROM user ORDER BY identifier LIMIT 1" http://127.0.0.1:18080/user.csv'
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: booker12
      - assert:
          stderr:
            not_contains:
              - Downloading http://127.0.0.1
              - Downloaded http://127.0.0.1

  - name: downloads a remote CSV through .import in batch mode
    # Needs a POSIX shell and python3 to serve the fixture over HTTP; the
    # download path itself is exercised on Linux and macOS.
    skip:
      os: windows
    steps:
      - fixture:
          file: user.csv
          content: |
            user_name,identifier,first_name,last_name
            booker12,1,Rachel,Booker
            jenkins46,2,Mary,Jenkins
            smith79,3,Jamie,Smith
      - run:
          command: sh -c 'python3 -m http.server 18081 --bind 127.0.0.1 >/tmp/sqly-http-import-shell.log 2>&1 & pid=$!; trap "kill $pid" EXIT; i=0; until python3 -c "import socket,sys; sys.exit(socket.socket().connect_ex((\"127.0.0.1\",18081)))"; do i=$((i+1)); [ $i -ge 50 ] && { echo "the local HTTP fixture never started listening" >&2; exit 1; }; sleep 0.1; done; printf ".import http://127.0.0.1:18081/user.csv\nSELECT COUNT(*) AS c FROM user;\n" | sqly --allow-remote --output-format csv'
      - assert:
          exit_code: 0
          stdout:
            contains:
              - c
              - "3"
      - assert:
          stderr:
            not_contains:
              - Downloading http://127.0.0.1
              - Downloaded http://127.0.0.1
  # A URL sqly cannot fetch used to fall through to the local-path branch and be
  # reported as "path does not exist", which reads as a missing file and sends
  # the user to check a URL that was never going to be downloaded.
  - name: names the scheme when a URL is not http or https
    steps:
      - run:
          command: sqly --sql "SELECT 1" s3://bucket/data.csv
      - assert:
          exit_code: 3
          stderr:
            contains:
              - 's3://bucket/data.csv'
              - 'only http and https URLs'
            not_contains: "path does not exist"

  - name: names the scheme for a file:// URL and points at the plain path
    steps:
      - fixture:
          file: user.csv
          content: |
            user_name,identifier
            booker12,1
      - run:
          command: sqly --sql "SELECT 1" file:///tmp/user.csv
      - assert:
          exit_code: 3
          stderr:
            contains:
              - 'drop the "file://" prefix'
              - "/tmp/user.csv"
            not_contains: "path does not exist"

  # A local file whose name merely contains a colon is not a URL, so it must keep
  # the missing-file message rather than being explained as a bad scheme.
  - name: keeps the missing-path message for a colon in a local file name
    steps:
      - run:
          command: sqly --sql "SELECT 1" weird:name.csv
      - assert:
          exit_code: 3
          stderr:
            contains: "path does not exist"
            not_contains: "only http and https URLs"

  # A server describing what it sent — a redirect, a Content-Disposition header —
  # used to decide the table name, so a query written against the URL the user
  # typed could not find its own table. The URL names the table now.
  - name: keeps the table named after the URL through a redirect
    skip:
      os: windows
    steps:
      - fixture:
          file: serve_redirect.py
          content: |
            import http.server, socketserver, threading, time
            CSV = b"a,b\n1,x\n"
            class H(http.server.BaseHTTPRequestHandler):
                def log_message(self, *a): pass
                def do_GET(self):
                    if self.path == "/sales.csv":
                        self.send_response(302)
                        self.send_header("Location", "/elsewhere.csv")
                        self.end_headers()
                    elif self.path == "/named.csv":
                        self.send_response(200)
                        self.send_header("Content-Disposition", 'attachment; filename="renamed.csv"')
                        self.end_headers(); self.wfile.write(CSV)
                    elif self.path == "/elsewhere.csv":
                        self.send_response(200); self.end_headers(); self.wfile.write(CSV)
                    else:
                        self.send_response(404); self.end_headers()
            socketserver.TCPServer.allow_reuse_address = True
            srv = socketserver.TCPServer(("127.0.0.1", 18089), H)
            threading.Thread(target=srv.serve_forever, daemon=True).start()
            time.sleep(120)
      - run:
          command: sh -c 'python3 serve_redirect.py & pid=$!; trap "kill $pid" EXIT; i=0; until python3 -c "import socket,sys; sys.exit(socket.socket().connect_ex((\"127.0.0.1\",18089)))"; do i=$((i+1)); [ $i -ge 50 ] && { echo "the local HTTP fixture never started listening" >&2; exit 1; }; sleep 0.1; done; sqly --allow-remote --output-format csv --sql "SELECT a FROM sales" http://127.0.0.1:18089/sales.csv'
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "1"

  - name: keeps the table named after the URL despite a Content-Disposition header
    skip:
      os: windows
    steps:
      - fixture:
          file: serve_named.py
          content: |
            import http.server, socketserver, threading, time
            CSV = b"a,b\n1,x\n"
            class H(http.server.BaseHTTPRequestHandler):
                def log_message(self, *a): pass
                def do_GET(self):
                    self.send_response(200)
                    self.send_header("Content-Disposition", 'attachment; filename="renamed.csv"')
                    self.end_headers(); self.wfile.write(CSV)
            socketserver.TCPServer.allow_reuse_address = True
            srv = socketserver.TCPServer(("127.0.0.1", 18090), H)
            threading.Thread(target=srv.serve_forever, daemon=True).start()
            time.sleep(120)
      - run:
          command: sh -c 'python3 serve_named.py & pid=$!; trap "kill $pid" EXIT; i=0; until python3 -c "import socket,sys; sys.exit(socket.socket().connect_ex((\"127.0.0.1\",18090)))"; do i=$((i+1)); [ $i -ge 50 ] && { echo "the local HTTP fixture never started listening" >&2; exit 1; }; sleep 0.1; done; sqly --allow-remote --output-format csv --sql "SELECT a FROM sales" http://127.0.0.1:18090/sales.csv'
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "1"
