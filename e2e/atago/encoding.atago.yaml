# A leading Unicode byte-order mark must not corrupt an import, and non-UTF-8
# text imports must be decodable on demand. Editors and shells (Excel, Notepad,
# PowerShell) prepend a UTF-8 BOM, and a UTF-8 or UTF-16 BOM used to leak into
# the first column name or break parsing, so a query on the plain column name
# failed with "no such column". sqly now honors BOMs and lets the user select a
# text encoding for CSV/TSV/LTSV/JSON/JSONL imports. Run with:
# make test-e2e
#
# Fixtures are base64 so the raw BOM/UTF-16/Shift-JIS bytes survive intact.
version: "1"

suite:
  name: sqly text encoding handling on import

scenarios:
  - name: utf-8 BOM on a CSV keeps the first column queryable by its plain name
    steps:
      - fixture:
          file: bom.csv
          base64: "77u/bmFtZSxhZ2UKYWxpY2UsMzAK"
      - run:
          command: sqly --output-format csv --sql "SELECT name FROM bom WHERE age = 30" bom.csv
      - assert:
          exit_code: 0
          stdout:
            contains: alice
          stderr:
            not_contains: "no such column"

  - name: utf-8 BOM on a TSV keeps the first column queryable by its plain name
    steps:
      - fixture:
          file: bom.tsv
          base64: "77u/bmFtZQlhZ2UKYWxpY2UJMzAK"
      - run:
          command: sqly --output-format csv --sql "SELECT name FROM bom WHERE age = 30" bom.tsv
      - assert:
          exit_code: 0
          stdout:
            contains: alice
          stderr:
            not_contains: "no such column"

  - name: utf-8 BOM on an LTSV keeps the first label queryable by its plain name
    steps:
      - fixture:
          file: bom.ltsv
          base64: "77u/bmFtZTphbGljZQlhZ2U6MzAK"
      - run:
          command: sqly --output-format csv --sql "SELECT name FROM bom WHERE age = 30" bom.ltsv
      - assert:
          exit_code: 0
          stdout:
            contains: alice
          stderr:
            not_contains: "no such column"

  - name: utf-8 BOM on a JSON array parses instead of failing
    steps:
      - fixture:
          file: bom.json
          base64: "77u/W3sibmFtZSI6ImFsaWNlIiwiYWdlIjozMH1d"
      - run:
          command: sqly --output-format csv --sql "SELECT json_extract(data, '$.name') AS n FROM bom" bom.json
      - assert:
          exit_code: 0
          stdout:
            contains: alice

  - name: utf-8 BOM on a JSONL parses instead of failing
    steps:
      - fixture:
          file: bom.jsonl
          base64: "77u/eyJuYW1lIjoiYWxpY2UiLCJhZ2UiOjMwfQo="
      - run:
          command: sqly --output-format csv --sql "SELECT json_extract(data, '$.name') AS n FROM bom" bom.jsonl
      - assert:
          exit_code: 0
          stdout:
            contains: alice

  - name: utf-16 LE CSV is transcoded to UTF-8 instead of misreading columns
    steps:
      - fixture:
          file: utf16.csv
          base64: "//5uAGEAbQBlACwAYQBnAGUACgBhAGwAaQBjAGUALAAzADAACgA="
      - run:
          command: sqly --output-format csv --sql "SELECT name FROM utf16 WHERE age = 30" utf16.csv
      - assert:
          exit_code: 0
          stdout:
            contains: alice
          stderr:
            not_contains: "column count mismatch"

  - name: --encoding shift-jis decodes a CSV without a BOM
    steps:
      - fixture:
          file: people.csv
          base64: "aWQsbmFtZQoxLJG+mFkKMiyJ1I5xCg=="
      - run:
          command: sqly --encoding shift-jis --output-format csv --sql "SELECT name FROM people ORDER BY id LIMIT 1" people.csv
      - assert:
          exit_code: 0
          stdout:
            contains: 太郎

  # The same file read as UTF-8 — the default — used to load. SQLite stores TEXT
  # as UTF-8, so the bytes went in as they were, came back as mojibake, and the
  # run exited 0: a wrapper that checks the exit code got corrupt data and no
  # warning. filesql v0.36.0 refuses the file instead. It is refused rather than
  # guessed at, because nothing in the bytes says which encoding they are and a
  # wrong guess is the same corruption in another shape.
  - name: refuses a Shift-JIS file read as UTF-8 instead of importing mojibake
    steps:
      - fixture: &shiftjis
          file: people.csv
          base64: "aWQsbmFtZQoxLJG+mFkKMiyJ1I5xCg=="
      - run:
          command: sqly --output-format json --sql "SELECT name FROM people ORDER BY id LIMIT 1" people.csv
      - assert:
          exit_code: 3
          stderr:
            contains: "invalid UTF-8"
      - assert:
          stdout:
            equals: ""

  # What replaced the silent load has to be actionable: the loader says a byte is
  # invalid, which does not tell the reader that sqly can decode the file for
  # them. The hint names the flag and the encodings it accepts.
  - name: names the flag that reads a non-UTF-8 file
    steps:
      - fixture: *shiftjis
      - run:
          command: sqly --sql "SELECT name FROM people" people.csv
      - assert:
          exit_code: 3
          stderr:
            contains: "--encoding"
      - assert:
          stderr:
            contains: shift-jis

  # The encoding is fixed when the process starts, so an .import typed into a
  # running session cannot reach the flag and is told to restart with it rather
  # than pointed at a command that does not exist.
  - name: tells a running session the encoding is chosen at startup
    steps:
      - fixture: *shiftjis
      - fixture:
          file: seed.csv
          content: |
            id
            1
      - run:
          command: sqly seed.csv
          stdin: ".import people.csv\n"
      - assert:
          stderr:
            contains: "restart with --encoding"

  # An import that failed for another reason must not collect encoding advice.
  - name: leaves an unrelated import failure without encoding advice
    steps:
      - fixture:
          file: dup.csv
          content: |
            a,a
            1,2
      - run:
          command: sqly --sql "SELECT * FROM dup" dup.csv
      - assert:
          exit_code: 3
          stderr:
            contains: duplicate column name
      - assert:
          stderr:
            not_contains: "--encoding"

  # filesql v0.36.0 also names the column a duplicate name is, which a header
  # whose duplicate is the empty name could not say before: the message ended at
  # the colon.
  - name: says which column a duplicate name is
    steps:
      - fixture:
          file: unnamed.csv
          content: |
            a,,
            1,2,3
      - run:
          command: sqly --sql "SELECT * FROM unnamed" unnamed.csv
      - assert:
          exit_code: 3
          stderr:
            contains: "column 3"

  - name: names the encoding and gets the text back
    steps:
      - fixture: *shiftjis
      - run:
          command: sqly --encoding shift-jis --output-format json --sql "SELECT name FROM people ORDER BY id LIMIT 1" people.csv
      - assert:
          exit_code: 0
          stdout:
            contains: 太郎
      - assert:
          stdout:
            not_contains: '\ufffd'
