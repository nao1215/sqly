# PTY tests for sqly's interactive shell (its readline REPL). A `run:` step feeds
# stdin as a non-TTY batch script and never exercises the prompt; a `pty:` step
# runs sqly inside a real pseudo-terminal and drives it with an expect/send
# session, so the interactive path — prompt rendering, per-command execution,
# dot-commands, live .mode switching, error recovery, and clean exit — is
# verified end to end against the real binary.
#
# These run on Unix (POSIX pty) and Windows (ConPTY). They were once skipped on
# Windows: the prompt entered raw mode on os.Stdin while go-tty read from a
# different handle (CONIN$), so on a ConPTY input delivered right after a
# re-rendered prompt went to an ungoverned handle and could be dropped, leaving a
# command typed but never executed and the session hung. prompt v0.0.11 routes raw
# mode through go-tty's own handle on Windows (github.com/nao1215/prompt/issues/13),
# so the read path and raw mode share one handle and the skip is gone. Three
# authoring rules keep the sessions robust, including when the whole suite runs in
# parallel and the sessions starve each other of CPU:
#
#   * Submit a command with a trailing CR in the same send (`"...\r"`), not a
#     separate `{key: enter}` step. The prompt is re-rendered a beat before its
#     read loop is ready, so an Enter delivered as its own write right after the
#     command can be dropped, leaving the command typed but never executed. Sending
#     the command and its CR as one write keeps them in the same read, so the CR is
#     not lost. A bare "\n" is not the Return key a raw-mode line editor waits for;
#     the CR (0x0d) is.
#   * Quit with EOF (`send: ""`, a single ^D) after the prompt returns, not by
#     typing ".exit" — a one-byte terminal EOF cannot race the completer or the
#     prompt's read-readiness the way a multi-character command submitted with
#     Enter can. After a query, wait for a token that appears only in the
#     executed result before expecting the prompt again, or the prompt echoed
#     mid-typing would match too early.
#   * Give the pty a wide terminal (cols: 220). The prompt embeds the working
#     directory, and under CI the temp sandbox path is long, so prefix plus command
#     can land a character exactly on the last column. ConPTY defers the wrap at the
#     final column (pending-wrap), which the line editor's redraw math mishandles,
#     so a command whose length hits the width boundary can fail to execute. A wide
#     terminal keeps every prompt-plus-command on one row regardless of the sandbox
#     path length.
version: "1"

suite:
  name: sqly interactive shell (pty)

scenarios:
  - name: an interactive query prints its result table
    steps:
      - fixture: &people
          file: people.csv
          content: |
            name,age,city
            Alice,30,Tokyo
            Bob,25,Osaka
            Carol,41,Kyoto
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$' # the prompt ends with "(<mode>)$ "; table is default
            - send: "SELECT name FROM people WHERE age = 25;\r"
            - expect: "Bob" # Bob is the only 25-year-old; a result token, not echoed text
            - expect: '\(table\)\$' # the prompt returned, editor idle again
            - send: "" # EOF (^D) quits cleanly
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Bob"
              - "+--" # the box-drawn result table sqly renders to the terminal

  - name: the prompt reflects a live .mode switch
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".mode csv\r"
            - expect: '\(csv\)\$' # the mode change is live: the next prompt says csv
            - send: ""
      - assert:
          exit_code: 0

  - name: .dialect changes translation for a later interactive query
    description: "Covers the real prompt path: the helper command mutates shell state, and the next query is translated under that dialect before execution."
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".dialect postgres\r"
            - expect: "dialect set to postgresql"
            - expect: '\(table\)\$'
            - send: "SELECT name FROM people WHERE name ILIKE 'a%';\r"
            - expect: "Alice"
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "dialect set to postgresql"
              - "Alice"

  - name: .tables lists the imported table
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".tables\r"
            - expect: "people" # the imported CSV became the "people" table
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains: "people"

  - name: .schema shows the imported columns
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".schema people\r" # .schema requires a table name
            - expect: "city" # a column from the CREATE TABLE DDL, post-execution
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "CREATE TABLE"
              - "city"

  - name: a computed aggregate round-trips through the shell
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            # A distinctive, self-labeling result so the wait cannot match stray
            # output — the count of the three imported rows.
            - send: "SELECT 'ROWS=' || COUNT(*) AS r FROM people;\r"
            - expect: "ROWS=3"
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains: "ROWS=3"

  - name: two queries run in one interactive session
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT name FROM people WHERE city = 'Tokyo';\r"
            - expect: "Alice"
            - expect: '\(table\)\$'
            - send: "SELECT name FROM people WHERE city = 'Kyoto';\r"
            - expect: "Carol"
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Alice"
              - "Carol"

  - name: an invalid query reports an error and the shell recovers to the prompt
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT * FROM no_such_table;\r"
            - expect: "no such table" # the query error is reported, not swallowed
            - expect: '\(table\)\$' # the shell recovered to a working prompt (it did
              # not exit on the error) — the clean EOF exit below confirms it is
              # still reading input.
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains: "no such table"

  # A statement without a trailing ";" is buffered until it is complete. The
  # continuation prompt is the only thing that says so: without it the cursor
  # dropped to a bare line, which is indistinguishable from a hung shell.
  - name: a statement without a semicolon shows the continuation prompt
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT name,\r" # incomplete: the buffer continues instead of running
            - expect: '\.\.\.>' # the continuation marker, not a bare line
            - send: "age FROM people WHERE age = 41;\r"
            - expect: "Carol" # the two lines ran as one statement
            - expect: '\(table\)\$' # and the main prompt came back
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "...>"
              - "Carol"

  # A dot-command is always complete, so it must run on the first Enter rather
  # than opening a continuation the user then has to escape.
  - name: a dot-command never opens a continuation
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".tables\r"
            - expect: "people"
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            not_contains: "...>"

  - name: EOF at the prompt exits the shell cleanly
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "" # EOF (^D) at an empty prompt exits with status 0
      - assert:
          exit_code: 0

  # A refused .import is a command error, not a fatal one: the prompt prints it
  # and reads the next line. The URL points at a host that cannot resolve, so a
  # run that somehow attempted the download would fail differently — the
  # capability refusal is the only way to reach this text.
  - name: a refused remote .import leaves the session running
    steps:
      - fixture: &capability_people
          file: people.csv
          content: |
            name,age,city
            Alice,30,Tokyo
            Bob,25,Osaka
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".import https://sqly-e2e.invalid/users.csv\r"
            - expect: "allow-remote" # the refusal names the flag that would allow it
            - expect: '\(table\)\$' # the prompt came back, so the session is alive
            - send: "SELECT name FROM people WHERE age = 25;\r"
            - expect: "Bob" # and it still answers over the table it already had
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains: "Bob"

  # The same session with the capability granted still refuses a scheme sqly
  # cannot fetch, and still survives it.
  - name: a session with --allow-remote still refuses a non-http scheme and continues
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly --allow-remote people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".import ftp://sqly-e2e.invalid/users.csv\r"
            - expect: "only http and https"
            - expect: '\(table\)\$'
            - send: "SELECT name FROM people WHERE age = 30;\r"
            - expect: "Alice"
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains: "Alice"

  # Switching to a non-SQLite dialect at the prompt says once what the choice
  # means. The message goes to stderr, which a pty merges into the same stream a
  # user sees, so it is visible here and provably absent from a piped stdout in
  # e2e/atago/dialect_warning.atago.yaml.
  - name: switching dialect at the prompt warns once about SQLite semantics
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".dialect postgresql\r"
            - expect: "SQLite semantics"
            - expect: '\(table\)\$'
            - send: "SELECT name FROM people WHERE age = 25;\r"
            - expect: "Bob"
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains: "Bob"

  # A comment's apostrophe is text, not an unterminated quote. The prompt is
  # where a person meets this most often: the line looks right and sqly says the
  # quoting is wrong.
  - name: runs a statement whose comment holds an apostrophe
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT name /* it's fine */ FROM people WHERE age = 25;\r"
            - expect: "Bob"
            - expect: '\(table\)\$'
            - send: ""
      - assert:
          exit_code: 0
          stdout:
            contains: "Bob"

  # A line sqly rejected is the one most worth editing again, so it is in the
  # history: the up-arrow brings it back.
  - name: recalls a rejected line with the up-arrow
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".import 'oops\r"
            - expect: "unterminated single quote in command"
            - expect: '\(table\)\$'
            - send: { key: up }
            - expect: "\\.import 'oops"
            # Clear the recalled line before EOF: Ctrl-D on a line with text is
            # not an end of input.
            - send: { key: ctrl-u }
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0

  # Completion knows which command it is completing. ".row-mismatch s" used to
  # answer SELECT and SET — the SQL keywords — and never "skip", the only value
  # that prefix names.
  - name: completes a row-mismatch policy, not a SQL keyword
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".row-mismatch s\t"
            - expect: "skip"
            - send: "\r"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "skip"

  # The same prefix means different things after different commands: "m" is
  # mysql after .dialect and markdown after .mode. Both used to be offered for
  # both.
  - name: completes a dialect after .dialect and a format after .mode
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".dialect m\t"
            - expect: "mysql"
            - send: "\r"
            - expect: '\(table\)\$'
            - send: ".mode m\t"
            - expect: "markdown"
            - send: "\r"
            - expect: '\(markdown\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0

  # A SQL keyword is offered upper-cased and nobody types it that way, so the
  # match has to ignore case. The prompt then discarded the answer with a
  # case-sensitive filter of its own, so Tab after a lower-cased word did
  # nothing at all: no menu, no completion, no change to the line. Completion
  # now says which span each suggestion replaces, so the match sqly made is the
  # one the prompt applies.
  - name: completes a lower-cased SQL keyword
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "sel\t"
            - expect: "SELECT" # the typed "sel" was replaced, not appended to
            - send: " 'KEYWORD' || '_DONE' AS k;\r"
            - expect: "KEYWORD_DONE" # the completed line is runnable SQL
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "KEYWORD_DONE"
            not_contains: "sel SELECT" # what appending instead of replacing produced

  # A table alias followed by a dot is one word to the line editor, so filtering
  # the flat candidate list by it matched nothing: writing a join, where the
  # qualifier is the point, was the case completion helped with least. The
  # alias is now resolved against the statement's FROM clause and the columns
  # are offered under it.
  - name: completes a column through its table alias
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            # "ci" names only the city column of people, so the completion is
            # unambiguous and applies without a menu selection.
            - send: "SELECT * FROM people p WHERE p.ci\t"
            - expect: "p.city"
            - send: " = 'Tokyo';\r"
            - expect: "Alice" # the only Tokyo row: the completed column really ran
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "Alice"

  # A table position takes a table name and nothing else. Completion used to
  # answer it from one flat list of keywords, tables, and every column of every
  # table, so the name that could go there was buried among names that could
  # not.
  - name: completes a table name after FROM
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT name FROM peo\t"
            - expect: "people"
            - send: " WHERE age = 25;\r"
            - expect: "Bob"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "Bob"

  # Completion on a continuation line, which is where a statement long enough to
  # need one is being written. The word being completed was taken as everything
  # after the last space, and on a fresh line that still held the newline, so it
  # matched nothing and the menu was empty exactly where it was most wanted.
  - name: completes on the continuation line of a multi-line statement
    steps:
      - fixture: *people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT name\r" # unfinished: the buffer continues
            - expect: '\.\.\.>'
            - send: "FROM people WHERE ci\t"
            - expect: "city" # the column completed from the second line
            - send: " = 'Kyoto';\r"
            - expect: "Carol"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "Carol"

  # A column added by SQL is completable in the same session. Completion caches
  # each table's columns and keys the cache by the table-name set, which an
  # ALTER TABLE ... ADD COLUMN leaves untouched, so the columns offered stayed
  # as they were before the statement ran.
  - name: completes a column added by ALTER TABLE
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "ALTER TABLE people ADD COLUMN nickname;\r"
            - expect: "statement executed successfully"
            - expect: '\(table\)\$'
            - send: "SELECT nickn\t"
            - expect: "nickname" # the new column reached completion
            - send: " FROM people WHERE name = 'Alice';\r"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "nickname"

  # Whether what has been typed is a finished statement is a question only the
  # dialect answers. The prompt asked it under the dialect the process started
  # with, so after ".dialect mysql" a line whose terminator is followed by a "#"
  # comment -- a comment MySQL has and SQLite does not -- waited on a
  # continuation for a rest that had already been written, and the statement
  # never ran.
  - name: a statement finished under the dialect .dialect selected runs on that Enter
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".dialect mysql\r"
            - expect: "dialect set to mysql"
            - expect: '\(table\)\$'
            # CONCAT because "||" is logical OR in MySQL, not concatenation, so
            # the marker is built by a function the translation carries over.
            - send: "SELECT CONCAT('RAN','_ON_ENTER') AS r; # a mysql comment\r"
            - expect: "RAN_ON_ENTER"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "RAN_ON_ENTER"
            not_contains: "...>" # it ran on that Enter rather than buffering

  # Editing an earlier line of a buffered statement leaves the screen alone. The
  # renderer erased the block it had drawn by moving up its height, which is
  # where the cursor is only while it sits on the last line; a left arrow
  # crossing the line break put it on the first, so every keystroke after that
  # erased one row too high and the prompt walked up the screen, taking a line of
  # scrollback with it each time. Fixed in prompt v0.0.14.
  #
  # The banner sqly prints at startup is what the climb ate, so it is what the
  # screen is checked for: after sixteen left arrows it is still there, above a
  # prompt still holding both lines of the statement.
  - name: editing an earlier line leaves the lines above the prompt alone
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 12
          cols: 80
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT name\r"
            - expect: '\.\.\.>'
            - send: "FROM people"
            - expect: "FROM people"
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            - send: { key: left }
            # Typing here is the barrier: the character lands where the sixteen
            # arrows left the cursor, so seeing it proves every one of them has
            # been processed and the screen below is the settled one.
            - send: "X"
            - expect: "SELECT Xname"
            # The screen is checked while the statement is still being edited:
            # after the exit below it holds neither line.
            - expect_screen:
                contains: 'enter "SQL query" or "sqly command that begins with a dot".'
            - expect_screen:
                contains: ".help print usage, .exit exit sqly."
            - expect_screen:
                contains: "...> FROM people"
            # Ctrl-U clears the line so Ctrl-D is read as end of input rather
            # than as a delete.
            - send: { key: ctrl-u }
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0

  # Ctrl-C abandons the line being typed and nothing else. It used to end the
  # session with a non-zero status, so a half-typed query could not be dropped
  # without losing the shell.
  - name: Ctrl-C discards the line and the session keeps working
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT 'NEVER_RUN"
            - expect: "NEVER_RUN"
            - send: { key: ctrl-c }
            - expect: '\^C' # the interrupt was taken; only Ctrl-C prints this
            - expect: '\(table\)\$' # a fresh prompt, not an exit
            - send: "SELECT name FROM people WHERE age = 25;\r"
            - expect: "Bob" # a result token: the typed line does not contain it
            - expect: '\(table\)\$'
            - send: { key: ctrl-c } # and again from an empty prompt
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0 # an interrupt is not a failure
          stdout:
            contains: "Bob"

  # A line can hold more than one statement, which is what pasting a snippet
  # produces. Every statement runs and every result is printed; the line used to
  # reach the engine as a single query, which kept one result and dropped the
  # rest.
  - name: every statement of a multi-statement line prints its result
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            # Both markers are concatenated by the engine, so each string exists
            # only in a printed result and never in the echo of the line typed.
            - send: "SELECT 'FIRST' || '_RESULT' AS a; SELECT 'SECOND' || '_RESULT' AS b;\r"
            - expect: "FIRST_RESULT"
            - expect: "SECOND_RESULT"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "FIRST_RESULT"
              - "SECOND_RESULT"

  # A ";" ends a statement only where SQLite ends one. Inside a trigger body it
  # separates the body's statements without ending the CREATE TRIGGER holding
  # them, so the buffer keeps collecting until END; — the shell submitted at the
  # first inner ";" and no trigger could be typed at all.
  - name: a trigger body buffers past its own semicolons
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "CREATE TABLE audit (msg TEXT);\r"
            - expect: "statement executed successfully"
            - expect: '\(table\)\$'
            - send: "CREATE TRIGGER audit_trg AFTER INSERT ON audit BEGIN\r"
            - expect: '\.\.\.>' # the statement is unfinished, so it buffers
            # The body's own ";" must not submit. Waiting for the echoed body line
            # is what proves the send landed: the continuation marker is already
            # on screen from the line before, so expecting it again would match
            # without anything having happened.
            - send: "INSERT INTO audit VALUES ('BODY_LINE');\r"
            - expect: "BODY_LINE"
            - send: "END;\r"
            # The count is computed by the engine, so this string cannot be
            # matched against the CREATE TRIGGER line echoed earlier. It is 1 only
            # if the whole trigger reached SQLite as one statement.
            - send: "SELECT 'TRIGGERS=' || COUNT(*) AS n FROM sqlite_master WHERE type = 'trigger';\r"
            - expect: "TRIGGERS=1"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "TRIGGERS=1"

  # A comment after the terminator does not delay the statement it follows. The
  # shell asked whether the line ended with ";", so this one waited on a
  # continuation for a rest that was never coming.
  - name: a statement with a trailing comment runs on that Enter
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT name FROM people WHERE age = 25; -- a note\r"
            - expect: "Bob"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
          stdout:
            contains: "Bob"
            not_contains: "...>"

  # Ctrl-C stops a statement that is already running. The prompt holds the
  # terminal in raw mode, where Ctrl-C is a byte rather than a signal, and
  # between prompts nothing was reading it: the key could not reach a running
  # statement at all, so it waited in the buffer while the statement ran to
  # completion and was then read as the next line.
  #
  # The statement counts to two billion, which takes minutes. The scenario
  # timeout is what makes this an assertion: a shell that does not cancel it
  # cannot finish in time. The interrupt is sent right behind the Enter rather
  # than after a pause — the byte waits in the input the shell is not reading
  # yet, which is exactly the case that used to be lost.
  - name: Ctrl-C stops a running statement and the session continues
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: "SELECT count(*) AS counted FROM (WITH RECURSIVE c(x) AS (SELECT 1 UNION ALL SELECT x+1 FROM c WHERE x < 2000000000) SELECT x FROM c);\r"
            - send: { key: ctrl-c }
            - expect: "canceled"
            - expect: '\(table\)\$'
            # The connection the statement was canceled on still answers, and
            # the marker is concatenated so it cannot match the echoed line.
            - send: "SELECT 'STILL' || '_ALIVE' AS a;\r"
            - expect: "STILL_ALIVE"
            - expect: '\(table\)\$'
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0 # canceling a statement is not a failed session
          stdout:
            contains: "STILL_ALIVE"

  # What the screen shows after a statement typed across a continuation line.
  # The prompt that follows a result used to reach up into it: the renderer
  # erased one row per row the entry had occupied, so a two-line statement ate
  # the last line printed for it while the same query typed on one line kept it.
  #
  # The check is on the screen rather than the stream, because the erased line is
  # still in the stream — erasing is what the terminal does with it. csv mode
  # makes the last printed line a row of data, so the line at risk carries a
  # marker of its own; in table mode it would be a border, indistinguishable
  # from the two above it.
  - name: a result typed across two lines keeps its last line on screen
    steps:
      - fixture: *capability_people
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: ".mode csv\r"
            - expect: '\(csv\)\$'
            # Unfinished, so Enter continues the statement instead of running it.
            - send: "SELECT 'LAST' || '_ROW' AS r FROM people LIMIT 1\r"
            - expect: '\.\.\.>'
            - send: ";\r"
            - expect: "LAST_ROW"
            - expect_screen:
                contains: "LAST_ROW"
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0

  # History outlives the session it was typed in: it is a file, and a later shell
  # preloads its newest entries into the prompt. What the up-arrow reaches in a
  # fresh process is the whole point of persisting it at all.
  - name: recalls with the up-arrow what an earlier session typed
    env:
      SQLY_HISTORY_PATH: "${workdir}/history"
    steps:
      - fixture: &history_people
          file: people.csv
          content: |
            id,name
            1,Alice
            2,Bob
      # A first session types a statement and leaves.
      - run:
          command: sqly people.csv
          stdin: "SELECT name FROM people WHERE id = 2;\n"
      - assert:
          exit_code: 0
          stdout:
            contains: "Bob"
      # A second process, with nothing typed into it yet, reaches that statement.
      - pty:
          command: sqly people.csv
          rows: 30
          cols: 220
          timeout: 30s
          session:
            - expect: '\(table\)\$'
            - send: { key: up }
            - expect: "SELECT name FROM people WHERE id = 2"
            - send: { key: ctrl-u }
            - send: { key: ctrl-d }
      - assert:
          exit_code: 0
