# The recipes shown on the front page of the docs and in doc/cookbook.md, run
# against the real binary so a copied command cannot silently stop working. Each
# scenario is the command as written, with the fixture the reader is told to
# create. Run with: make test-e2e
version: "1"

suite:
  name: cookbook recipes

scenarios:
  # The first command anyone runs. Its output is quoted verbatim on the site, so
  # the whole table is pinned, not just a substring.
  - name: the thirty-second example prints the documented table
    steps:
      - fixture: &staff
          file: staff.csv
          content: |
            name,dept,salary
            alice,eng,120
            bob,sales,90
            carol,eng,140
      - run:
          command: sqly --sql "SELECT dept, ROUND(AVG(salary)) AS avg FROM staff GROUP BY dept" staff.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              +-------+-----+
              | dept  | avg |
              +-------+-----+
              | eng   | 130 |
              | sales |  90 |
              +-------+-----+

  - name: inspect reports the schema of an unfamiliar file
    steps:
      - fixture: *staff
      - run:
          command: sqly --inspect --inspect-sample 0 staff.csv
      - assert:
          exit_code: 0
          stdout:
            json:
              path: "$.tables[0].name"
              equals: staff

  - name: converts a csv to json, excel, and parquet
    steps:
      - fixture: *staff
      - run:
          command: sqly --output-format json --output staff.json --sql "SELECT * FROM staff" staff.csv
      - assert:
          exit_code: 0
          file:
            path: staff.json
            contains: alice
      - run:
          command: sqly --output-format excel --output staff.xlsx --sql "SELECT * FROM staff" staff.csv
      - assert:
          exit_code: 0
          file:
            path: staff.xlsx
            exists: true
      - run:
          command: sqly --output-format parquet --output staff.parquet --sql "SELECT * FROM staff" staff.csv
      - assert:
          exit_code: 0
      - run:
          command: sqly --output-format csv --sql "SELECT COUNT(*) AS c FROM staff" staff.parquet
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "3"

  - name: joins a gzipped csv with a parquet file
    # Needs the gzip(1) binary to build the compressed input.
    skip:
      os: windows
    steps:
      - fixture: &orders
          file: orders.csv
          content: |
            id,pid
            1,10
            2,20
      - fixture: &products
          file: products.csv
          content: |
            id,name
            10,widget
            20,gadget
      - run:
          command: sqly --output-format parquet --output products.parquet --sql "SELECT * FROM products" products.csv
      - assert:
          exit_code: 0
      - run:
          command: gzip -f orders.csv
      - assert:
          exit_code: 0
      - run:
          command: sqly --output-format csv --sql "SELECT p.name FROM orders o JOIN products p ON o.pid = p.id ORDER BY o.id" orders.csv.gz products.parquet
      - assert:
          exit_code: 0
          stdout:
            contains:
              - widget
              - gadget

  - name: pulls a field out of a jsonl file
    steps:
      - fixture:
          file: sample.jsonl
          content: |
            {"name":"alice","age":30}
            {"name":"bob","age":22}
      - run:
          command: sqly --output-format csv --sql "SELECT json_extract(data, '$.name') AS name FROM sample WHERE json_extract(data, '$.age') >= 30" sample.jsonl
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: alice

  - name: counts rows piped in on stdin
    # Needs a POSIX shell for the pipeline.
    skip:
      os: windows
    steps:
      - fixture: *staff
      - run:
          command: sh -c 'cat staff.csv | sqly --output-format csv --stdin-format csv --sql "SELECT COUNT(*) AS c FROM stdin"'
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "3"

  - name: loads every supported file in a directory
    steps:
      - fixture:
          file: data/users.csv
          content: |
            id,name
            1,alice
      - fixture:
          file: data/orders.csv
          content: |
            id,user_id
            9,1
      - run:
          command: sqly --output-format csv --sql "SELECT u.name FROM users u JOIN orders o ON u.id = o.user_id" data
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: alice

  - name: ranks rows with a window function
    steps:
      - fixture: &actor
          file: actor.csv
          content: |
            actor,total_gross
            Harrison Ford,4871.7
            Samuel Jackson,4772.8
            Morgan Freeman,4468.3
      - run:
          command: sqly --output-format csv --sql "SELECT actor, RANK() OVER (ORDER BY total_gross DESC) AS rank FROM actor" actor.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "Harrison Ford,1"

  - name: edits a file in place
    steps:
      - fixture: &user
          file: user.csv
          content: |
            user_name,identifier,first_name
            booker12,1,Rachel
            jenkins46,2,Mary
      - run:
          command: sqly user.csv
          stdin: |
            UPDATE user SET first_name = 'Rachelle' WHERE identifier = 1;
            .save --in-place
      - assert:
          exit_code: 0
          file:
            path: user.csv
            contains: Rachelle

  - name: translates postgresql syntax
    # The SQL needs both quote characters — a double-quoted identifier or JSON
    # key alongside a single-quoted literal — and atago keeps a backslash
    # literal on Windows so a C:\ path survives, which leaves no way to escape
    # one inside the other. The behavior itself is covered on Linux and macOS.
    skip:
      os: windows
    steps:
      - fixture: *user
      - run:
          command: sqly --output-format csv --dialect postgresql --sql "SELECT user_name FROM \"user\" WHERE user_name ILIKE 'B%'" user.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: booker12

  - name: skips a ragged row instead of failing the import
    steps:
      - fixture: &ragged
          file: ragged.csv
          content: |
            id,name
            1,alice
            2,bob,extra
      - run:
          command: sqly --output-format csv --row-mismatch skip --sql "SELECT COUNT(*) AS c FROM ragged" ragged.csv
      - assert:
          exit_code: 0
          stdout:
            line: 2
            equals: "1"
      - run:
          command: sqly --sql "SELECT 1" ragged.csv
      - assert:
          exit_code: 1
          stderr:
            contains: column count mismatch

  - name: runs a script from a heredoc in batch mode
    # Needs a POSIX shell for the pipeline.
    skip:
      os: windows
    steps:
      - fixture: *staff
      - run:
          command: sh -c "printf '.mode csv\nSELECT name FROM staff ORDER BY name;\n' | sqly staff.csv"
      - assert:
          exit_code: 0
          stdout:
            contains:
              - alice
              - bob
              - carol
